<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TradeLens Admin: Payments</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040a1b">
<link rel="icon" href="/favicon-48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/theme.css">
<script src="/auth.js"></script>
<style>
.sub{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.sub button{flex:1 1 30%;width:auto;min-width:0;padding:10px 6px;font-size:13px;line-height:1.2}
</style>
</head>
<body>
<header><a class="brand" href="/"><img src="/logo-mark.png" alt=""><span><b>Trade<i>Lens</i></b><small>by Driverline</small></span></a></header>
<main id="root"><span class="mut">Loading...</span></main>
<script>
const $=id=>document.getElementById(id);let pending=null;
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function kv(k,v,c){const d=el('div','kv');d.append(el('span','',k),el('span',c||'',v));return d}
function opt(s,v,t){const o=document.createElement('option');o.value=v;o.textContent=t;s.append(o)}
async function api(path,method,body,base){
  const r=await fetch((base||'/api/admin')+path,{method:method||'GET',headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d;
}
const SECTIONS=[
  ['naira','Naira (Moniepoint)','Naira payments (Moniepoint)',b=>loadNaira(b)],
  ['crypto','Crypto','Crypto payments (NOWPayments)',b=>loadCrypto(b,'open')],
  ['manual','Manual USDT and credits','Billing and signal credits',b=>loadBilling(b)]];
function show(key){
  const s=SECTIONS.find(x=>x[0]===key)||SECTIONS[0];
  try{history.replaceState(null,'','#'+s[0])}catch(e){}
  const root=$('root');root.textContent='';
  const back=el('p','mut');const a=el('a','','Back to Admin');a.href='/admin.html';back.append(a);
  const bar=el('div','sub');
  SECTIONS.forEach(x=>{const b=el('button',x[0]===s[0]?'on':'ghost',x[1]);b.onclick=()=>show(x[0]);bar.append(b)});
  const card=el('div','card');card.append(el('h2','',s[2]));const box=el('div');card.append(box);
  root.append(back,bar,card);s[3](box);
}
async function loadBilling(box){
  try{
    const r=await api('/billing');box.textContent='';
    box.append(el('div','mut','Members pay outside the app, send you the transaction reference, and you approve the order here. Approving adds the signals once. Members and the admin are never affected by billing.'));
    const on=document.createElement('input');on.type='checkbox';on.checked=r.enabled;on.style.width='auto';
    const lab=el('label','sw');lab.append(on,document.createTextNode(' Billing is open to members'));box.append(lab);
    const f={};const field=(k,label,ph)=>{box.append(el('label','',label));const i=document.createElement('input');i.value=r.settings[k]||'';i.placeholder=ph||'';f[k]=i;box.append(i)};
    field('pay_trc20','USDT (TRC20) address');field('pay_bep20','USDT (BEP20) address');field('bank_name','Bank name');field('bank_account_name','Bank account name');field('bank_account_number','Bank account number');field('ngn_rate','Naira per 1 USD','for example 1600');field('note','Note shown to members (optional)');field('support','Support contact shown to members (email or WhatsApp)','for example support@yourdomain.com');
    const msg=el('div','mut');
    const save=el('button','','Save billing settings');save.style.marginTop='10px';
    save.onclick=async()=>{try{if(on.checked&&!r.enabled&&!confirm('Open billing to members now?'))return;
      const b={enabled:on.checked};Object.keys(f).forEach(k=>b[k]=f[k].value);await api('/billing/settings','POST',b);loadBilling(box)}catch(e){msg.className='err';msg.textContent=e.message}};
    box.append(save,msg);
    box.append(el('h2','','Continue with Deriv'));
    const dvOn=document.createElement('input');dvOn.type='checkbox';dvOn.checked=r.settings.deriv_enabled==='1';dvOn.style.width='auto';
    const dvl=el('label','sw');dvl.append(dvOn,document.createTextNode(' Deriv sign-in is open on the sign-in page'));box.append(dvl);
    const dv={};const dfield=(k,label,ph)=>{box.append(el('label','',label));const i=document.createElement('input');i.value=r.settings[k]||'';i.placeholder=ph||'';dv[k]=i;box.append(i)};
    dfield('deriv_app_id','Deriv App ID');dfield('deriv_ib_link','Your Deriv IB link');dfield('deriv_cashier_url','Link behind "Fund your Deriv account" (optional)','https://...');
    const dsave=el('button','','Save Deriv settings');dsave.style.marginTop='10px';const dmsg=el('div','mut');
    dsave.onclick=async()=>{try{if(dvOn.checked&&r.settings.deriv_enabled!=='1'&&!confirm('Open Deriv sign-in to the public now?'))return;
      const b={deriv_enabled:dvOn.checked?'1':'0'};Object.keys(dv).forEach(k=>b[k]=dv[k].value);await api('/billing/settings','POST',b);loadBilling(box)}catch(e){dmsg.className='err';dmsg.textContent=e.message}};
    box.append(dsave,dmsg);
    box.append(el('h2','','Help someone whose Deriv account is already linked'));
    const la=document.createElement('input');la.placeholder='Deriv account ID (for example CR1234567)';const lo=el('div','mut');
    const lk=el('button','ghost','Look up');lk.style.marginTop='8px';
    lk.onclick=async()=>{lo.textContent='';lo.className='mut';try{const x=await api('/deriv/lookup?account_id='+encodeURIComponent(la.value.trim()));
      if(!x.found){lo.textContent='Not linked to anyone and no invite issued for it.';return}
      lo.textContent=x.linked?'Linked to '+(x.email||'a TradeLens user')+'.':'Verified, invite '+(x.invite_open?'not used yet.':'already used or removed.');
      if(x.linked||x.invite_open){const ul=el('button','ghost','Unlink so they can verify again');ul.style.marginTop='8px';
        ul.onclick=async()=>{if(!confirm('Unlink this Deriv account? Only do this once you are sure the person is the real owner. Welcome signals already given stay as they are.'))return;
          try{await api('/deriv/unlink','POST',{account_id:la.value.trim()});lo.textContent='Unlinked.';ul.remove()}catch(e){alert(e.message)}};lo.append(document.createElement('br'),ul)}}catch(e){lo.className='err';lo.textContent=e.message}};
    box.append(la,lk,lo);
    box.append(el('h2','','Orders waiting for you'));
    if(!r.open.length)box.append(el('div','mut','None right now.'));
    const money=o=>o.currency==='NGN'?'\u20a6'+Math.round(o.amount_local).toLocaleString():'$'+o.amount_usd;
    r.open.forEach(o=>{
      const d=el('div');d.style.cssText='border-top:1px solid var(--line);padding:8px 0';
      d.append(el('div','hd',o.label+' \u00b7 '+money(o)),el('div','mut',o.email+' \u00b7 '+o.method_label+' \u00b7 ref '+o.ref),
        el('div',o.status==='submitted'?'win':'mut',o.status==='submitted'?'Payment reference from member: '+o.txid:'Member has not sent a payment reference yet'));
      const row=el('div','btns');
      const ap=el('button','','Approve');ap.onclick=async()=>{if(!confirm('Approve '+o.label+' for '+o.email+'?\n\nOnly approve after you have seen the payment arrive. This adds their signals.'))return;try{await api('/billing/order/'+o.id+'/approve','POST');loadBilling(box)}catch(e){alert(e.message)}};
      const rj=el('button','ghost','Reject');rj.onclick=async()=>{const n=prompt('Reason shown to the member (optional):','Payment could not be confirmed');if(n===null)return;try{await api('/billing/order/'+o.id+'/reject','POST',{note:n});loadBilling(box)}catch(e){alert(e.message)}};
      row.append(ap,rj);d.append(row);box.append(d)});
    box.append(el('h2','','Add or remove signals by hand'));
    const em=document.createElement('input');em.placeholder='Member email';const n=document.createElement('input');n.type='number';n.placeholder='Signals (negative to remove)';n.inputMode='numeric';const nt=document.createElement('input');nt.placeholder='Reason (required)';
    const am=el('div','mut');const ab=el('button','ghost','Apply');ab.style.marginTop='8px';
    ab.onclick=async()=>{try{const x=await api('/billing/adjust','POST',{email:em.value,delta:Number(n.value),note:nt.value});am.className='win';am.textContent='Done. New balance: '+x.balance;em.value=n.value=nt.value=''}catch(e){am.className='err';am.textContent=e.message}};
    box.append(em,n,nt,ab,am);
    if(r.recent.length){box.append(el('h2','','Recently decided'));r.recent.forEach(o=>box.append(el('div','mut',o.status+' \u00b7 '+o.label+' \u00b7 '+o.email+' \u00b7 '+o.ref)))}
  }catch(e){box.textContent=e.message}
}
async function loadCrypto(box,filter){
  box.textContent='';
  let r;try{r=await api('/pay/crypto?status='+encodeURIComponent(filter||'open'))}catch(e){box.append(el('div','err',e.message));return}
  const when=t=>t?new Date(t*1000).toLocaleString():'-';
  box.append(el('div','mut','USDT (TRC20) payments confirmed automatically. Successful payments credit the member by themselves; you only step in for the exceptions listed here. Orders appear under Billing only if they were paid by hand.'));
  if(r.problems.length)r.problems.forEach(p=>box.append(el('div','warn','Not ready: '+p)));
  const sel=document.createElement('select');[['off','Off: nobody can start an automatic payment'],['admin','Pilot: admin accounts only'],['public','Public: every member']].forEach(([v,t])=>opt(sel,v,t));sel.value=r.mode;
  const mb=el('button','','Save mode');mb.style.marginTop='8px';const mm=el('div','mut');
  mb.onclick=async()=>{if(sel.value==='public'&&r.mode!=='public'&&!confirm('Make automatic crypto payments available to every member now?'))return;
    try{await api('/pay/crypto/toggle','POST',{mode:sel.value});loadCrypto(box,filter)}catch(e){mm.className='err';mm.textContent=e.message}};
  box.append(el('label','','Who can pay automatically'),sel,mb,mm);
  box.append(el('div','mut','Switching to Off only stops new payments. A payment already sent is still detected and credited.'));
  if(r.ipn_url){const l=el('div','kv');l.append(el('span','','IPN URL for NOWPayments'));const v=el('span','',r.ipn_url);v.style.wordBreak='break-all';l.append(v);box.append(l);
    const cp=el('button','ghost','Copy IPN URL');cp.style.cssText='width:auto;padding:6px 12px;margin-top:4px';cp.onclick=async()=>{try{await navigator.clipboard.writeText(r.ipn_url);cp.textContent='Copied'}catch(e){prompt('Copy this:',r.ipn_url)}};box.append(cp)}
  box.append(kv('API address',r.api_base),kv('Currency / network',r.pay_currency));
  const ck=el('button','ghost','Check connection to NOWPayments');ck.style.cssText='width:auto;padding:6px 12px;margin:8px 0';const cm=el('div','mut');
  ck.onclick=async()=>{ck.disabled=true;cm.className='mut';cm.textContent='Checking...';
    try{const x=await api('/pay/crypto/check','POST');
      cm.className=x.api_reachable&&x.currency_listed!==false?'win':'warn';
      cm.textContent=(x.problems.length?'Missing: '+x.problems.join('; '):'')+(x.api_reachable===null?'':(x.api_reachable?'NOWPayments reachable with your key. ':'NOWPayments not reachable or key rejected ('+x.detail+'). '))+(x.currency_listed===null?'':Object.entries(x.currencies||{}).map(([c,ok])=>c+(ok?' is offered. ':' is NOT offered on this account. ')).join(''))}
    catch(e){cm.className='err';cm.textContent=e.message}ck.disabled=false};
  box.append(ck,cm);
  const cs=Object.entries(r.counts).map(([k,v])=>k+' '+v).join(' · ');box.append(el('div','mut',cs?'Orders: '+cs:'No automatic orders yet.'));
  const f=document.createElement('select');['open','review','approved','failed','expired','refunded','rejected','all'].forEach(v=>opt(f,v,v==='review'?'Needs your attention':v));f.value=r.status;f.onchange=()=>loadCrypto(box,f.value);f.style.marginTop='8px';box.append(f);
  if(!r.orders.length)box.append(el('div','mut','Nothing to show.'));
  r.orders.forEach(o=>{
    const d=el('div');d.style.cssText='border-top:1px solid var(--line);padding:8px 0';
    d.append(el('div','hd',o.label+' · $'+o.amount_usd),el('div','mut',o.email+' · ref '+o.ref+' · '+when(o.created_at)),
      el('div',o.status==='approved'?'win':(o.status==='review'||o.status==='failed')?'warn':'mut','Status: '+o.status+(o.provider_status?' (provider: '+o.provider_status+')':'')));
    if(o.pay_amount!=null)d.append(el('div','mut','Paid '+(o.actually_paid||0)+' of '+o.pay_amount+' USDT · last checked '+when(o.last_polled_at)));
    if(o.provider_payment_id)d.append(el('div','mut','NOWPayments payment ID '+o.provider_payment_id));
    if(o.review_reason)d.append(el('div','warn',o.review_reason));
    const row=el('div','btns');
    if(o.provider_payment_id&&['pending','confirming','review','expired','failed'].includes(o.status)){
      const rc=el('button','ghost','Re-check with NOWPayments');rc.onclick=async()=>{rc.disabled=true;try{const x=await api('/pay/crypto/order/'+o.id+'/reconcile','POST');alert('Result: '+x.result+'. Order is now '+x.status+'.');loadCrypto(box,f.value)}catch(e){alert(e.message);rc.disabled=false}};row.append(rc)}
    if(o.status==='review'){
      const ap=el('button','','Approve and credit');ap.onclick=async()=>{const n=prompt('Why are you approving this? (required, kept in the record)\n\n'+o.email+' · '+o.label+' · '+o.review_reason);if(!n)return;
        if(!confirm('Credit '+o.label+' to '+o.email+' now? This cannot be undone.'))return;
        try{await api('/pay/crypto/order/'+o.id+'/resolve','POST',{action:'approve',note:n});loadCrypto(box,f.value)}catch(e){alert(e.message)}};
      const rj=el('button','ghost','Reject');rj.onclick=async()=>{const n=prompt('Why are you rejecting this? (required, kept in the record)');if(!n)return;
        try{await api('/pay/crypto/order/'+o.id+'/resolve','POST',{action:'reject',note:n});loadCrypto(box,f.value)}catch(e){alert(e.message)}};row.append(ap,rj)}
    const hs=el('button','ghost','History');const hb=el('div','mut');hb.style.fontSize='13px';
    hs.onclick=async()=>{if(hb.textContent){hb.textContent='';return}try{const x=await api('/pay/crypto/order/'+o.id+'/events');hb.textContent=x.events.map(e=>when(e.created_at)+'  '+e.source+'  '+e.kind+(e.provider_status?' ['+e.provider_status+']':'')+(e.detail?'  '+e.detail:'')).join('\n');hb.style.whiteSpace='pre-wrap'}catch(e){hb.textContent=e.message}};
    row.append(hs);d.append(row,hb);box.append(d)});
  if(r.exceptions.length){box.append(el('h2','','Recent exceptions'));
    r.exceptions.forEach(x=>{const e=el('div','mut',when(x.created_at)+' · '+x.kind+(x.order_id?' · order #'+x.order_id:'')+' · '+(x.detail||''));e.style.fontSize='13px';box.append(e)})}
}
async function loadNaira(box,st){
  st=st||{status:'open',q:'',from:'',to:'',offset:0};
  box.textContent='';
  let r;try{r=await api('/pay/naira?'+new URLSearchParams({status:st.status,q:st.q,from:st.from,to:st.to,offset:st.offset||0}))}catch(e){box.append(el('div','err',e.message));return}
  const when=t=>t?new Date(t*1000).toLocaleString():'-';
  const money=n=>n==null?'-':'₦'+Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
  const reload=()=>loadNaira(box,st);
  box.append(el('div','mut','Members pay by bank transfer to the Moniepoint business account. Nothing is automatic: a bank alert or a customer\'s claim never approves an order. Check the credit in the Moniepoint account yourself, then match it to the order and press Approve Payment. Only an exact amount is approved; any other amount waits for your decision.'));
  r.problems.forEach(p=>box.append(el('div','warn','Not ready: '+p+'.')));
  const sel=document.createElement('select');[['off','Off: nobody can start a Naira order'],['admin','Pilot: admin accounts only'],['public','Public: every member']].forEach(([v,t])=>opt(sel,v,t));sel.value=r.mode;
  const mb=el('button','','Save mode');mb.style.marginTop='8px';const mm=el('div','mut');
  mb.onclick=async()=>{if(sel.value==='public'&&r.mode!=='public'&&!confirm('Make Pay with Naira available to every member now?'))return;
    try{await api('/pay/naira/toggle','POST',{mode:sel.value});reload()}catch(e){mm.className='err';mm.textContent=e.message}};
  box.append(el('label','','Who can pay with Naira'),sel,mb,mm);
  box.append(el('div','mut','Switching to Off only stops new orders. Orders that already exist stay visible and can still be approved here.'));
  box.append(kv('Bank',r.bank.bank_name||'not set'),kv('Account name',r.bank.account_name||'not set'),kv('Account number',r.bank.account_number||'not set'),kv('Naira rate',r.rate?('1 USD = ₦'+r.rate):'not set'));
  box.append(el('div','mut','The bank details and the rate are edited above under Billing and signal credits.'));
  const cs=Object.entries(r.counts).map(([k,v])=>k+' '+v).join(' · ');box.append(el('div','mut',cs?'Orders: '+cs:'No Naira orders yet.'));
  // filters
  const f=el('div');f.style.marginTop='10px';
  const fs=document.createElement('select');['open','pending','review','approved','rejected','expired','cancelled','all'].forEach(v=>opt(fs,v,v==='open'?'Open (pending and in review)':v));fs.value=r.status;
  const fq=document.createElement('input');fq.placeholder='Search: reference, narration, email, amount, bank reference';fq.value=r.q||'';
  const fd=document.createElement('input');fd.type='date';fd.value=st.from||'';const ft=document.createElement('input');ft.type='date';ft.value=st.to||'';
  const go=el('button','ghost','Search');go.style.cssText='width:auto;padding:6px 12px;margin-top:6px';
  go.onclick=()=>{st={status:fs.value,q:fq.value,from:fd.value,to:ft.value,offset:0};reload()};
  fq.onkeydown=e=>{if(e.key==='Enter')go.onclick()};
  f.append(fs,fq,el('label','','From'),fd,el('label','','To'),ft,go);box.append(f);
  box.append(el('div','mut','Showing '+r.orders.length+' of '+r.total+' matching orders.'));
  if(!r.orders.length)box.append(el('div','mut','Nothing to show.'));
  r.orders.forEach(o=>{
    const d=el('div');d.style.cssText='border-top:1px solid var(--line);padding:10px 0';
    d.append(el('div','hd',o.label+' · '+money(o.expected)+' (US$'+o.amount_usd+')'),
      el('div','mut',o.email+' · ref '+o.ref+' · narration '+o.narration+' · '+when(o.created_at)),
      el('div',o.status==='approved'?'win':o.status==='review'?'warn':(o.status==='rejected'?'loss':'mut'),'Status: '+o.status+(o.decided_by?' · by '+o.decided_by+' on '+when(o.decided_at):'')));
    if(o.bank_ref)d.append(el('div','mut','Bank reference '+o.bank_ref+(o.received!=null?' · received '+money(o.received):'')));
    if(o.review_reason)d.append(el('div','warn',o.review_reason));
    if(o.claim)d.append(el('div','mut','Customer note (not proof): '+o.claim));
    if(o.status==='approved'&&o.fulfilled_at)d.append(el('div','mut','Fulfilled '+when(o.fulfilled_at)+(o.signals?' · '+o.signals+' signals':'')+(o.days?' · '+o.days+' days':'')));
    const row=el('div','btns');const form=el('div');form.hidden=true;
    if(['pending','review','expired','cancelled'].includes(o.status)){
      const vb=el('button','','Verify and approve');vb.onclick=()=>{form.hidden=!form.hidden};row.append(vb);
      const br=document.createElement('input');br.placeholder='Bank transaction reference (from the Moniepoint account)';
      const am=document.createElement('input');am.type='number';am.step='0.01';am.inputMode='decimal';am.placeholder='Amount actually received (₦)';am.value=o.received!=null?o.received:o.expected;
      const nt=document.createElement('input');nt.placeholder='Note (required for a difference, or if the order is not pending)';
      const ac=document.createElement('input');ac.type='checkbox';ac.style.width='auto';const al=el('label','sw');al.append(ac,document.createTextNode(' Accept an amount that differs from the order'));
      const msg=el('div','mut');
      const ap=el('button','','Approve Payment');ap.style.marginTop='8px';
      ap.onclick=async()=>{
        if(!br.value.trim()){msg.className='err';msg.textContent='Enter the bank transaction reference.';return}
        if(!confirm('Approve '+o.label+' for '+o.email+'?\n\nExpected '+money(o.expected)+', you entered '+money(Number(am.value))+'.\nOnly approve after you have seen this credit in the Moniepoint account.'))return;
        ap.disabled=true;
        try{const x=await api('/pay/naira/order/'+o.id+'/approve','POST',{bank_ref:br.value,amount_received:am.value,note:nt.value,accept_difference:ac.checked});
          if(x.result==='review')alert('The amount differs from the order ('+x.reason+'). The order is now in review and nothing was credited. Decide below: approve with "Accept an amount that differs" and a note, or reject.');
          else if(x.result==='already_approved')alert('This order was already approved. Nothing was credited a second time.');
          reload()}catch(e){msg.className='err';msg.textContent=e.message;ap.disabled=false}};
      form.append(br,am,nt,al,ap,msg);
      const fl=el('button','ghost','Flag for investigation');fl.onclick=async()=>{const n=prompt('Why is this order being investigated? (required, kept in the record)');if(!n)return;try{await api('/pay/naira/order/'+o.id+'/flag','POST',{note:n});reload()}catch(e){alert(e.message)}};
      const rj=el('button','ghost','Reject');rj.onclick=async()=>{const n=prompt('Internal reason for rejecting (required, kept in the record, never shown to the member):');if(!n)return;if(!confirm('Reject this order?'))return;try{await api('/pay/naira/order/'+o.id+'/reject','POST',{reason:n});reload()}catch(e){alert(e.message)}};
      row.append(fl,rj);
    }
    const hs=el('button','ghost','History');const hb=el('div','mut');hb.style.fontSize='13px';
    hs.onclick=async()=>{if(hb.textContent){hb.textContent='';return}try{const x=await api('/pay/naira/order/'+o.id+'/events');hb.textContent=x.events.map(e=>when(e.created_at)+'  '+e.source+(e.admin_email?' ('+e.admin_email+')':'')+'  '+e.kind+(e.detail?'  '+e.detail:'')).join('\n');hb.style.whiteSpace='pre-wrap'}catch(e){hb.textContent=e.message}};
    row.append(hs);d.append(row,form,hb);box.append(d)});
  const pg=el('div','btns');
  if((st.offset||0)>0){const pv=el('button','ghost','Previous');pv.onclick=()=>{st={...st,offset:Math.max(0,(st.offset||0)-40)};reload()};pg.append(pv)}
  if((st.offset||0)+r.orders.length<r.total){const nx2=el('button','ghost','Next');nx2.onclick=()=>{st={...st,offset:(st.offset||0)+40};reload()};pg.append(nx2)}
  box.append(pg);
  // unmatched bank credits
  box.append(el('h2','','Unmatched bank credits'));
  box.append(el('div','mut','A credit in the Moniepoint account that you cannot match to an order (wrong or missing narration, odd amount). Record it so it is not forgotten. It leaves this list when an order is approved with the same bank reference.'));
  const ub=document.createElement('input');ub.placeholder='Bank transaction reference';const ua=document.createElement('input');ua.type='number';ua.step='0.01';ua.placeholder='Amount (₦, optional)';
  const un=document.createElement('input');un.placeholder='Narration you saw (optional)';const ut=document.createElement('input');ut.placeholder='Note: what you know about it (required)';
  const um=el('div','mut');const ug=el('button','ghost','Flag unmatched transfer');ug.style.marginTop='8px';
  ug.onclick=async()=>{try{await api('/pay/naira/unmatched','POST',{bank_ref:ub.value,amount:ua.value,narration_seen:un.value,note:ut.value});reload()}catch(e){um.className='err';um.textContent=e.message}};
  box.append(ub,ua,un,ut,ug,um);
  if(!r.unmatched.length)box.append(el('div','mut','No unmatched credits recorded.'));
  r.unmatched.forEach(x=>{const e=el('div','mut',when(x.created_at)+' · '+x.bank_ref+' · '+(x.detail||''));e.style.fontSize='13px';box.append(e)});
}
let enTimer=null;
async function start(){
  try{await api('/overview');show((location.hash||'').slice(1))}
  catch(e){$('root').textContent='';$('root').append(el('div','err',e.message),el('p','mut','This page is for admins only.'))}
}
window.addEventListener('hashchange',()=>{if($('root').querySelector('.sub'))show((location.hash||'').slice(1))});
start();
</script>
