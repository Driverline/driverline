<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TradeLens Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040a1b">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon-48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/theme.css">
<script src="/track.js"></script>
<script src="/auth.js"></script>
<style>
h1{font-size:22px;margin:6px 0 2px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}
@media (min-width:460px){.grid{grid-template-columns:repeat(3,1fr)}}
a.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:132px;padding:14px 10px;
  background:linear-gradient(160deg,#0a1b42,#050d24);border:1px solid var(--line);border-top-color:rgba(26,168,255,.45);border-radius:16px;color:var(--tx);text-decoration:none}
a.tile:active{transform:scale(.97);border-color:var(--gold)}
a.tile svg{width:38px;height:38px;stroke:var(--gold2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
a.tile b{font-size:16px}
a.tile small{color:var(--mut);font-size:12.5px;line-height:1.3}
a.tile .dlb{position:absolute;top:8px;right:8px;display:inline-block;background:var(--gold,#e8b84a);color:#02122c;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
h2.sec{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:20px 0 0}
</style>
</head>
<body>
<header><a class="brand" href="/"><img src="/logo-mark.png" alt=""><span><b>Trade<i>Lens</i></b><small>by Driverline</small></span></a></header>
<main>
<h1>Welcome to TradeLens</h1>
<div class="mut">Tap a tile to open it. The tabs at the top take you between pages, and Home brings you back here.</div>
<div class="grid" id="tiles"></div>
<h2 class="sec" id="adminh" hidden>Admin</h2>
<div class="grid" id="admintiles" hidden></div>
<small class="dis"><span id="me"></span> <a href="#" id="signout" style="color:var(--gold)">Sign out</a></small>
<small class="dis">Education and risk analysis only, not financial advice. Trading carries a high risk of loss.</small>
</main>
<script>
// The tiles are built from the tab bar (auth.js), so they always match what this member is allowed to open, including tabs that appear a moment later.
const I={ // simple line icons, 24x24
  analysis:'<path d="M4 20V4M4 20h16"/><path d="M8 15l3-4 3 2 5-7"/>',
  signals:'<path d="M12 3a6 6 0 0 0-6 6c0 5-2 6-2 7h16c0-1-2-2-2-7a6 6 0 0 0-6-6z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  risk:'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M12 8v4M12 15v.5"/>',
  journal:'<path d="M6 4h11a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2z"/><path d="M6 18a2 2 0 0 1 2-2h11M10 8h6"/>',
  mt5:'<path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0z"/><path d="M12 16v5"/>',
  billing:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/>',
  messages:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
  rewards:'<rect x="4" y="9" width="16" height="11" rx="1"/><path d="M12 9v11M3 9h18M12 9c-2-4-6-3-5 0M12 9c2-4 6-3 5 0"/>',
  partner:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M15 14c3-1 6 1 6 5"/>',
  admin:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'
};
const T={ // where each tab points: icon and a plain-words line for people new to trading
  '/analysis.html':['analysis','Check a chart before you trade'],
  '/signals.html':['signals','Trade ideas that fit your rules'],
  '/risk.html':['risk','See how much you could lose'],
  '/journal.html':['journal','Look back at your trades'],
  '/mt5.html':['mt5','Connect and protect your trading account'],
  '/billing.html':['billing','Plans, payments and your balance'],
  '/inbox.html':['messages','News and replies from TradeLens'],
  '/rewards.html':['rewards','Points and prizes'],
  '/partner.html':['partner','Referrals and the partner programme'],
  '/admin.html':['admin','Members and settings'],
  '/admin-messages.html':['messages','Members’ messages'],
  '/admin-payments.html':['billing','Payments'],
  '/admin-partners.html':['partner','Partner management'],
  '/admin-rewards.html':['rewards','Rewards management']
};
function tile(a){
  const href=a.getAttribute('href'),m=T[href]||['analysis',''];
  const t=document.createElement('a');t.className='tile';t.href=href;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 24 24');svg.innerHTML=I[m[0]]||I.analysis;
  const name=document.createElement('b');name.textContent=a.firstChild?a.firstChild.textContent:a.textContent;
  const cap=document.createElement('small');cap.textContent=m[1];
  t.append(svg,name,cap);
  const badge=a.querySelector('.dlb');if(badge){const b=document.createElement('span');b.className='dlb';b.textContent=badge.textContent;t.append(b)}
  return t;
}
function build(){
  const nav=document.querySelector('nav.tabs');if(!nav)return;
  const g=document.getElementById('tiles'),ag=document.getElementById('admintiles');g.textContent='';ag.textContent='';
  nav.querySelectorAll('a').forEach(a=>{
    const href=a.getAttribute('href');if(href==='/')return;
    (a.dataset.admin?ag:g).append(tile(a));
  });
  document.getElementById('adminh').hidden=ag.hidden=!ag.children.length;
}
document.addEventListener('DOMContentLoaded',()=>{
  const nav=document.querySelector('nav.tabs');if(!nav)return;
  build();new MutationObserver(build).observe(nav,{childList:true,subtree:true,characterData:true});
});
</script>
</body>
</html>
