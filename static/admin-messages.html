<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TradeLens Inbox (admin)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040a1b">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon-48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/theme.css">
<script src="/auth.js"></script>
<style>
.conv{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);color:var(--tx);box-shadow:none;border-radius:12px;padding:10px 12px;margin:6px 0;font-weight:500;letter-spacing:0}
.conv.on{border-color:var(--gold)}
.conv b{display:block;overflow-wrap:anywhere}
.conv small{display:block;color:var(--mut);overflow-wrap:anywhere;margin-top:2px}
.dot{display:inline-block;background:var(--gold);color:#02122c;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;margin-left:6px;vertical-align:middle}
.msg{max-width:86%;padding:9px 12px;border-radius:12px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.35}
.msg small{display:block;margin-top:4px;color:var(--mut);font-size:11px}
.msg.me{margin-left:auto;background:#0d2a63;border:1px solid var(--line)}
.msg.them{margin-right:auto;background:#06122f;border:1px solid var(--line);border-left:3px solid var(--gold)}
.bc{padding:10px 0;border-top:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.bc:first-of-type{border-top:0}
.bc b{display:block}
.bc small{color:var(--mut)}
#thread{max-height:55vh;overflow-y:auto}
</style>
</head>
<body>
<header><a class="brand" href="/"><img src="/logo-mark.png" alt=""><span><b>Trade<i>Lens</i></b><small>by Driverline</small></span></a></header>
<main>
<div class="mut" id="me"></div>
<div id="note" class="mut"></div>

<div class="card"><h2>Broadcast to all members</h2>
  <div class="mut" style="margin-bottom:8px">One announcement every member sees in their Messages tab. It cannot be edited or recalled once sent. Plain text only.</div>
  <input id="btitle" maxlength="80" placeholder="Title (optional)">
  <textarea id="bbody" rows="4" maxlength="2000" placeholder="Announcement" style="margin-top:8px"></textarea>
  <button id="bsend" style="margin-top:8px">Send to everyone</button>
  <div id="bnote" class="mut" style="margin-top:6px"></div>
  <div id="bhist" style="margin-top:10px"></div>
</div>

<div class="card"><h2>Conversations <span id="cn"></span></h2>
  <div id="convs"><span class="mut">Loading...</span></div>
  <h2>Message a member</h2>
  <input id="newemail" type="email" placeholder="Member email" autocomplete="off">
  <textarea id="newbody" rows="3" maxlength="2000" placeholder="Message" style="margin-top:8px"></textarea>
  <button id="newsend" style="margin-top:8px">Send to this member</button>
  <div id="newnote" class="mut" style="margin-top:6px"></div>
</div>

<div class="card" id="tcard" hidden><h2 id="thead"></h2>
  <div id="thread"></div>
  <textarea id="reply" rows="3" maxlength="2000" placeholder="Reply"></textarea>
  <button id="rsend" style="margin-top:8px">Send reply</button>
  <div id="rnote" class="err" style="margin-top:6px"></div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
async function api(path,method,body){
  const r=await fetch('/api/admin'+path,{method:method||'GET',headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:('HTTP '+r.status));return d}
const when=t=>new Date(t*1000).toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
let open=null,busy=false;

async function loadConvs(){
  const d=await api('/inbox'),box=$('convs');box.textContent='';
  const unread=d.conversations.reduce((a,c)=>a+c.unread,0);
  $('cn').textContent='';if(unread)$('cn').append(el('span','dot',unread+' unread'));
  if(!d.conversations.length)box.append(el('div','mut','No conversations yet. Members write from their Messages tab.'));
  d.conversations.forEach(c=>{
    const b=el('button','conv'+(open===c.user_id?' on':''));
    const t=el('b','',c.email+' · '+(c.tier||''));if(c.unread)t.append(el('span','dot',String(c.unread)));
    b.append(t,el('small','',(c.last?(c.last.sender==='admin'?'You: ':'')+c.last.body+' · '+when(c.last.created_at):'')));
    b.onclick=()=>openThread(c.user_id);box.append(b)});
}
async function openThread(uid){
  open=uid;
  const d=await api('/inbox/'+uid),t=$('thread');t.textContent='';
  $('tcard').hidden=false;$('thead').textContent=d.user.email+' · '+d.user.tier;
  d.messages.forEach(m=>{const x=el('div','msg '+(m.sender==='admin'?'me':'them'));
    x.append(document.createTextNode(m.body),el('small','',(m.sender==='admin'?'Team · ':'Member · ')+when(m.created_at)));t.append(x)});
  t.scrollTop=t.scrollHeight;
  if(d.messages.some(m=>m.sender==='user'&&!m.read)){await api('/inbox/'+uid+'/read','POST');if(window.dlBadge)window.dlBadge()}
  await loadConvs();
}
async function loadBroadcasts(){
  const d=await api('/broadcasts'),box=$('bhist');box.textContent='';
  if(!d.broadcasts.length){box.append(el('div','mut','No broadcasts sent yet.'));return}
  box.append(el('div','mut','Sent so far (seen = members who opened their Messages tab since, out of '+d.members+')'));
  d.broadcasts.forEach(b=>{const x=el('div','bc');if(b.title)x.append(el('b','',b.title));
    x.append(document.createTextNode(b.body),el('small','',when(b.created_at)+' · seen by '+b.seen+' of '+d.members));box.append(x)});
}
$('bsend').onclick=async()=>{
  const title=$('btitle').value.trim(),body=$('bbody').value.trim();$('bnote').className='mut';$('bnote').textContent='';
  if(!body){$('bnote').className='err';$('bnote').textContent='Write the announcement first';return}
  if(!confirm('Send this to EVERY member? It cannot be edited or recalled.'))return;
  $('bsend').disabled=true;
  try{await api('/broadcast','POST',{title,body});$('btitle').value='';$('bbody').value='';$('bnote').className='win';$('bnote').textContent='Sent. Members see it in their Messages tab.';await loadBroadcasts()}
  catch(e){$('bnote').className='err';$('bnote').textContent=e.message}
  $('bsend').disabled=false;
};
$('newsend').onclick=async()=>{
  const email=$('newemail').value.trim(),body=$('newbody').value.trim();$('newnote').className='mut';$('newnote').textContent='';
  if(!email||!body){$('newnote').className='err';$('newnote').textContent='Enter the member email and a message';return}
  $('newsend').disabled=true;
  try{const r=await api('/inbox/send','POST',{email,body});$('newbody').value='';$('newemail').value='';await openThread(r.user_id)}
  catch(e){$('newnote').className='err';$('newnote').textContent=e.message}
  $('newsend').disabled=false;
};
$('rsend').onclick=async()=>{
  const body=$('reply').value.trim();$('rnote').textContent='';if(!body||!open)return;$('rsend').disabled=true;
  try{await api('/inbox/send','POST',{user_id:open,body});$('reply').value='';await openThread(open)}
  catch(e){$('rnote').textContent=e.message}
  $('rsend').disabled=false;
};
async function refresh(){
  if(busy)return;busy=true;
  try{await loadConvs()}catch(e){$('note').className='err';$('note').textContent=e.message}
  busy=false;
}
loadBroadcasts().catch(e=>{$('bhist').textContent=e.message});refresh();
setInterval(()=>{if(!document.hidden)refresh()},30000);
</script>
</body>
</html>
