<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TradeLens Admin: Copy trading</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040a1b">
<link rel="icon" href="/favicon-48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/theme.css">
<script src="/auth.js"></script>
</head>
<body>
<header><a class="brand" href="/"><img src="/logo-mark.png" alt=""><span><b>Trade<i>Lens</i></b><small>by Driverline</small></span></a></header>
<main id="root"><span class="mut">Loading...</span></main>
<script>
const $=id=>document.getElementById(id);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function kv(k,v,c){const d=el('div','kv');d.append(el('span','',k),el('span',c||'',v));return d}
async function api(path,method,body){
  const r=await fetch('/api/copy/admin'+path,{method:method||'GET',headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:('HTTP '+r.status));return d}
const day=t=>t?new Date(t*1000).toISOString().slice(0,16).replace('T',' '):'-';
let msg=null;
function note(t,c){if(msg){msg.className=c||'mut';msg.textContent=t}}
async function act(f){try{await f();await load()}catch(e){note(e.message,'err')}}
async function load(){
  const root=$('root');let d;
  try{d=await api('')}catch(e){root.textContent=e.message;return}
  root.textContent='';
  const head=el('div','card');head.append(el('h2','','Copy trading'),el('p','mut','Trades on the master account are copied to subscribed members who switched copying on, only if they have a stop loss and a take profit. Switch on automatic copying below to copy every new master trade the moment it opens, or flag trades by hand.'));
  msg=el('div','mut');head.append(msg);root.append(head);

  const A=d.auto||{},ac=el('div','card');ac.append(el('h2','','Copy every master trade automatically'));
  ac.append(el('p','mut','When ON, every NEW trade opened on the master account is flagged for copying by the system the moment it appears, so followers get a price close to yours. Same rules as a flag: a stop loss and a take profit are required, and each follower keeps their own lot size, risk limit, daily loss limit and equity protection. Trades already open when you switch it on, or found after the master account was offline, are never copied. A new trade without both stop loss and take profit within 45 seconds is left uncopied and you get an alert. At most '+A.max_per_day+' automatic copies per 24 hours.'));
  ac.append(kv('Status',A.enabled?'ON'+(A.since?' since '+day(A.since):''):'off',A.enabled?'win':'mut'),kv('Automatic copies, last 24 hours',String(A.last_24h||0)));
  const ab=el('button',A.enabled?'ghost':'',A.enabled?'Switch off automatic copying':'Switch on automatic copying');ab.style.margin='8px 0';
  ab.onclick=()=>{const t=A.enabled?'Stop copying new master trades automatically? Trades already flagged keep running. You can still flag by hand.':'Switch on automatic copying? From now on EVERY new trade on the master account is copied to all subscribed followers. Trades open right now are not copied.';if(confirm(t))act(()=>api('/auto','POST',{enabled:!A.enabled}))};
  ac.append(ab);
  if((A.recent||[]).length){ac.append(el('h3','','Latest master trades seen'));A.recent.forEach(x=>ac.append(el('div',x.action==='skipped'?'warn':'mut',day(x.first_seen)+' | '+(x.symbol||'?')+' '+(x.dir||'')+' #'+x.ticket+' | '+x.action+(x.note?' | '+x.note:''))))}
  root.append(ac);

  const au=el('div','card');au.append(el('h2','','AutoTrading access (private test)'),el('p','mut','AutoTrading places trades from signals on a member\'s own MT5. It is visible only to admins and the testers listed here (paid members). There is no public mode yet.'));
  try{const ar=await fetch('/api/auto/admin'),ad=await ar.json();if(!ar.ok)throw new Error(ad.detail||'HTTP '+ar.status);
    const ms=document.createElement('select');[['testers','On for admins and listed testers'],['off','Off for everyone']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;ms.append(o)});ms.value=ad.mode;
    const ta=document.createElement('textarea');ta.rows=4;ta.placeholder='One tester e-mail per line';ta.value=ad.testers.join('\n');
    const sb=el('button','','Save AutoTrading access');sb.style.marginTop='8px';
    sb.onclick=async()=>{try{const r=await fetch('/api/auto/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode:ms.value,testers:ta.value.split(/\s+/).filter(Boolean)})});
      const j=await r.json();if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:'HTTP '+r.status);note('AutoTrading access saved.','win');await load()}catch(e){note(e.message,'err')}};
    au.append(ms,ta,sb);
    au.append(el('h3','','Eligibility by account'));
    if(!ad.accounts.length)au.append(el('div','mut','No account has saved AutoTrading settings yet.'));
    ad.accounts.forEach(x=>{au.append(kv((x.email||'')+' / '+x.label,(x.enabled?'ON':x.paused?'PAUSED ('+x.paused+')':'off')+' | '+(x.equity!=null?'$'+x.equity.toFixed(2):'no equity')+' | tier '+(x.tier==null?'?':x.tier),x.status==='ok'?'mut':'warn'));
      au.append(el('div','mut','Symbols: '+(x.symbols.join(', ')||'none')+(x.not_allowed_now.length?' | not allowed now: '+x.not_allowed_now.join(', '):'')+' | status: '+x.status+' | last sync '+day(x.last_sync)))});
    au.append(el('h3','','Recent eligibility decisions'));
    if(!ad.events.length)au.append(el('div','mut','Nothing logged yet.'));
    ad.events.forEach(x=>au.append(el('div','mut',day(x.created_at)+' | account '+x.account_id+' | '+x.kind+' | '+x.detail)));
    au.append(kv('Accounts with AutoTrading on',String(ad.accounts_on)),kv('Auto trades, last 7 days',Object.entries(ad.jobs_7d).map(([k,v])=>v+' '+k).join(', ')||'none'));
  }catch(e){au.append(el('div','err',e.message))}
  root.append(au);

  const m=el('div','card');m.append(el('h2','','Master account'));
  const sel=document.createElement('select');
  const o0=document.createElement('option');o0.value='';o0.textContent='Choose one of your MT5 accounts';sel.append(o0);
  d.my_accounts.forEach(a=>{const o=document.createElement('option');o.value=a.id;o.textContent=a.label;sel.append(o)});
  if(d.master)sel.value=d.master.id;
  const sv=el('button','','Use as master');sv.style.marginTop='8px';
  sv.onclick=()=>{if(!sel.value)return;if(!confirm('Use this account as the copy-trading master? Members will copy the trades you flag on it, and every new trade on it if automatic copying is on.'))return;act(()=>api('/master','POST',{account:Number(sel.value)}))};
  m.append(sel,sv);
  if(d.master)m.append(kv('Master',d.master.label+(d.master.connected?' (connected)':' (not connected)'),d.master.connected?'win':'warn'));
  m.append(kv('Active followers',String(d.followers)));root.append(m);

  const p=el('div','card');p.append(el('h2','','Trades on the master account'));
  if(!d.master)p.append(el('div','mut','Choose the master account first.'));
  else if(!d.positions.length)p.append(el('div','mut','No open trades.'));
  d.positions.forEach(x=>{
    const row=el('div','kv');row.append(el('span','',x.symbol+' '+x.type+' '+x.volume+' | open '+x.open+' | SL '+(Number(x.sl)||'none')+' | TP '+(Number(x.tp)||'none')+' | P&L '+x.profit));
    p.append(row);
    if(x.flag_id){const b=el('button','ghost','Flagged. End copies');b.onclick=()=>{if(confirm('Close the copies of this trade on every follower account? Your own trade is not touched.'))act(()=>api('/flag/'+x.flag_id+'/close','POST'))};p.append(b)}
    else{const b=el('button','',x.can_flag?'Flag for copying':'Needs SL and TP in MT5');b.disabled=!x.can_flag;b.style.marginBottom='8px';
      b.onclick=()=>{if(confirm('Copy this '+x.symbol+' '+x.type+' to '+d.followers+' follower account(s)?\n\nEach follower is sized by their own settings and skipped if it risks more than their limit.'))
        act(async()=>{const r=await api('/flag','POST',{ticket:x.ticket});note('Flagged. '+r.followers+' follower account(s) will place it when their EA next checks in.','win')})};p.append(b)}
  });
  root.append(p);

  const f=el('div','card');f.append(el('h2','','Flagged trades'));
  if(!d.flags.length)f.append(el('div','mut','Nothing flagged yet.'));
  d.flags.forEach(x=>{
    const c=Object.entries(x.counts).map(([k,v])=>v+' '+k).join(', ')||'no followers';
    f.append(kv('#'+x.id+' '+x.symbol+' '+x.dir+' ('+x.status+')',c));
    const b=el('button','ghost','Details');b.style.marginBottom='8px';
    const out=el('div');b.onclick=async()=>{try{const jobs=await api('/flag/'+x.id);out.textContent='';
      jobs.forEach(j=>out.append(kv(j.email,j.status+(j.lots?' | '+j.lots+' lot':'')+(j.risk_pct!=null?' | '+j.risk_pct+'%':''),j.status==='skipped'||j.status==='failed'?'warn':'mut'),
        ...(j.note?[el('div','mut',j.note)]:[])));if(!jobs.length)out.append(el('div','mut','No followers had copying on.'))}catch(e){out.textContent=e.message}};
    f.append(b,out)});
  root.append(f);

  const s=el('div','card');s.append(el('h2','','Copy trading subscribers'));
  s.append(el('div','mut','Activate a member after you have confirmed their payment. Days stack on top of what they have left.'));
  const em=document.createElement('input');em.type='email';em.placeholder='Member email';
  const dy=document.createElement('input');dy.type='number';dy.placeholder='Days (e.g. 30)';dy.inputMode='numeric';
  const go=el('button','','Activate or extend');go.style.marginTop='8px';
  go.onclick=()=>act(async()=>{await api('/subscription','POST',{email:em.value,days:Number(dy.value)});note('Done.','win')});
  s.append(em,dy,go);
  d.subscribers.forEach(x=>{s.append(kv(x.email,(x.active?'until ':'ended ')+day(x.ends_at),x.active?'win':'mut'));
    if(x.active){const b=el('button','ghost','Revoke');b.style.marginBottom='8px';b.onclick=()=>{if(confirm('Revoke copy trading for '+x.email+'? Copying is switched off and waiting copies are cancelled. Their open copies stay open.'))act(()=>api('/subscription','POST',{user_id:x.user_id,revoke:true}))};s.append(b)}});
  root.append(s);
}
load();setInterval(()=>{if(!document.hidden&&!document.activeElement.matches('input,select'))load()},20000);
</script>
</body>
</html>
