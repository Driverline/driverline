<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TradeLens Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040a1b">
<link rel="icon" href="/favicon-48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/theme.css">
<script src="/auth.js"></script>
</head>
<body>
<header><a class="brand" href="/"><img src="/logo-mark.png" alt=""><span><b>Trade<i>Lens</i></b><small>by Driverline</small></span></a></header>
<main id="root"><span class="mut">Loading...</span></main>
<script>
const $=id=>document.getElementById(id);let pending=null;
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function kv(k,v,c){const d=el('div','kv');d.append(el('span','',k),el('span',c||'',v));return d}
function opt(s,v,t){const o=document.createElement('option');o.value=v;o.textContent=t;s.append(o)}
async function api(path,method,body,base){
  const r=await fetch((base||'/api/admin')+path,{method:method||'GET',headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d;
}
function note(text,cls){const n=$('note');n.className=cls||'mut';n.textContent=text}
async function act(fn){try{await fn();await load()}catch(e){note(e.message,'err')}}
function linkBox(link,mins){
  const b=$('linkbox');b.textContent='';b.append(el('div','mut','Send this link to the member. It works once and expires in '+mins+' minutes.'));
  const i=document.createElement('input');i.readOnly=true;i.value=link;i.onfocus=()=>i.select();b.append(i);
  const c=el('button','','Copy link');c.style.marginTop='8px';c.onclick=async()=>{try{await navigator.clipboard.writeText(link);c.textContent='Copied'}catch(e){i.select()}};b.append(c);
  b.scrollIntoView({behavior:'smooth'});
}
function render(d){
  const root=$('root');root.textContent='';
  root.append(el('div','mut','Signed in as '+d.me),el('div','',''));
  const n=el('div','mut');n.id='note';root.append(n);
  const s=el('div','card');s.append(el('h2','','Overview'),kv('Members',d.totals.users),kv('Paid (member)',d.totals.member),kv('Free',d.totals.free),kv('AI analyses used today',d.totals.ai_today),
    kv('Reset emails',d.mail_configured?'sending by email':'not set up: use "Reset link" below','mut'));root.append(s);
  const lb=el('div','card');lb.id='linkbox';lb.hidden=true;root.append(lb);

  const inv=el('div','card');inv.append(el('h2','','Invite codes'));
  const t=document.createElement('select');opt(t,'free','free');opt(t,'member','member');
  const u=document.createElement('input');u.type='number';u.value=10;u.min=1;u.max=1000;
  const c=document.createElement('input');c.placeholder='Custom code (optional)';
  const row=el('div','row');const a=el('div'),b=el('div');a.append(el('label','','Tier'),t);b.append(el('label','','Uses'),u);row.append(a,b);
  const mk=el('button','','Create invite');mk.style.marginTop='10px';
  mk.onclick=()=>act(async()=>{const r=await api('/invites','POST',{tier:t.value,uses:Number(u.value),code:c.value});pending=['New code: '+r.code+' ('+r.tier+', '+r.uses+' uses)','win']});
  inv.append(row,el('label','','Code'),c,mk);
  d.invites.forEach(i=>{const r=el('div','kv');r.append(el('span','',i.code+' · '+i.tier+' · '+i.uses_left+' left'));
    const x=el('button','ghost','Delete');x.style.width='auto';x.style.padding='6px 12px';x.onclick=()=>act(()=>api('/invites/'+encodeURIComponent(i.code),'DELETE'));r.append(x);inv.append(r)});
  if(!d.invites.length)inv.append(el('div','mut','No active codes.'));
  root.append(inv);

  const us=el('div');us.append(el('h2','','Members'));
  d.users.forEach(m=>{
    const card=el('div','card'),me=m.id===d.my_id;
    const h=el('div','hd');h.append(el('span','',m.email+(me?' (you)':'')),el('span',m.blocked?'loss':'mut',m.blocked?'blocked':m.tier));
    card.append(h,kv('AI today',m.used_today+' / '+m.limit),kv('Joined',m.created_at.slice(0,10)));
    const tier=document.createElement('select');['free','member','admin'].forEach(x=>opt(tier,x,x));tier.value=m.tier;tier.disabled=me;tier.style.marginTop='8px';
    tier.onchange=()=>act(()=>api('/users/'+m.id+'/tier','POST',{tier:tier.value}));card.append(tier);
    const btns=el('div','btns');
    const bl=el('button','ghost',m.blocked?'Unblock':'Block');bl.disabled=me;bl.onclick=()=>act(()=>api('/users/'+m.id+'/block','POST',{blocked:!m.blocked}));
    const rs=el('button','ghost','Reset link');rs.onclick=async()=>{try{const r=await api('/users/'+m.id+'/reset-link','POST');$('linkbox').hidden=false;linkBox(r.link,r.valid_minutes)}catch(e){note(e.message,'err')}};
    btns.append(bl,rs);card.append(btns);us.append(card)});
  root.append(us);

  const v=el('div','card');v.append(el('h2','','Deriv symbol check'));
  const vb=el('button','','Check all symbols');const vr=el('div');
  vb.onclick=async()=>{vr.textContent='Checking...';try{const r=await api('/verify','GET',null,'/api');vr.textContent='';
    Object.entries(r).forEach(([k,x])=>vr.append(kv(k+' ('+x.code+')',x.found?'found':'NOT FOUND',x.found?'win':'loss')))}catch(e){vr.textContent=e.message}};
  v.append(vb,vr);root.append(v);
  const bt=el('div','card');bt.append(el('h2','','Signal backtest'));const bb=el('div');bt.append(bb);root.append(bt);loadBacktest(bb);
  const bl=el('div','card');bl.append(el('h2','','Billing and signal credits'));const blb=el('div');bl.append(blb);root.append(bl);loadBilling(blb);
  const rs=el('div','card');rs.append(el('h2','','Forex and gold research'));const rsb=el('div');rs.append(rsb);root.append(rs);loadResearch(rsb);
  const ri=el('div','card');ri.append(el('h2','','Smart Analysis Timing insights'));const rb=el('div');rb.append(el('span','mut','Loading...'));ri.append(rb);root.append(ri);loadRadarInfo(rb);
  if(pending){note(pending[0],pending[1]);pending=null}
}
const STY={scalp:'Scalp (M5)',day:'Day (M15)',swing:'Swing (H1)'},SET={ema_pullback:'EMA pullback',squeeze_breakout:'Squeeze breakout',range_breakout:'20-bar breakout',range_reversal:'Range reversal'};
const pct=x=>Math.round(x*100)+'%',sg=x=>(x>=0?'+':'')+x.toFixed(2);
async function loadBilling(box){
  try{
    const r=await api('/billing');box.textContent='';
    box.append(el('div','mut','Members pay outside the app, send you the transaction reference, and you approve the order here. Approving adds the signals once. Members and the admin are never affected by billing.'));
    const on=document.createElement('input');on.type='checkbox';on.checked=r.enabled;on.style.width='auto';
    const lab=el('label','sw');lab.append(on,document.createTextNode(' Billing is open to members'));box.append(lab);
    const f={};const field=(k,label,ph)=>{box.append(el('label','',label));const i=document.createElement('input');i.value=r.settings[k]||'';i.placeholder=ph||'';f[k]=i;box.append(i)};
    field('pay_trc20','USDT (TRC20) address');field('pay_bep20','USDT (BEP20) address');field('bank_name','Bank name');field('bank_account_name','Bank account name');field('bank_account_number','Bank account number');field('ngn_rate','Naira per 1 USD','for example 1600');field('note','Note shown to members (optional)');field('support','Support contact shown to members (email or WhatsApp)','for example support@yourdomain.com');
    const msg=el('div','mut');
    const save=el('button','','Save billing settings');save.style.marginTop='10px';
    save.onclick=async()=>{try{if(on.checked&&!r.enabled&&!confirm('Open billing to members now?'))return;
      const b={enabled:on.checked};Object.keys(f).forEach(k=>b[k]=f[k].value);await api('/billing/settings','POST',b);loadBilling(box)}catch(e){msg.className='err';msg.textContent=e.message}};
    box.append(save,msg);
    box.append(el('h2','','Continue with Deriv'));
    const dvOn=document.createElement('input');dvOn.type='checkbox';dvOn.checked=r.settings.deriv_enabled==='1';dvOn.style.width='auto';
    const dvl=el('label','sw');dvl.append(dvOn,document.createTextNode(' Deriv sign-in is open on the sign-in page'));box.append(dvl);
    const dv={};const dfield=(k,label,ph)=>{box.append(el('label','',label));const i=document.createElement('input');i.value=r.settings[k]||'';i.placeholder=ph||'';dv[k]=i;box.append(i)};
    dfield('deriv_app_id','Deriv App ID');dfield('deriv_ib_link','Your Deriv IB link');dfield('deriv_cashier_url','Link behind "Fund your Deriv account" (optional)','https://...');
    const dsave=el('button','','Save Deriv settings');dsave.style.marginTop='10px';const dmsg=el('div','mut');
    dsave.onclick=async()=>{try{if(dvOn.checked&&r.settings.deriv_enabled!=='1'&&!confirm('Open Deriv sign-in to the public now?'))return;
      const b={deriv_enabled:dvOn.checked?'1':'0'};Object.keys(dv).forEach(k=>b[k]=dv[k].value);await api('/billing/settings','POST',b);loadBilling(box)}catch(e){dmsg.className='err';dmsg.textContent=e.message}};
    box.append(dsave,dmsg);
    box.append(el('h2','','Help someone whose Deriv account is already linked'));
    const la=document.createElement('input');la.placeholder='Deriv account ID (for example CR1234567)';const lo=el('div','mut');
    const lk=el('button','ghost','Look up');lk.style.marginTop='8px';
    lk.onclick=async()=>{lo.textContent='';lo.className='mut';try{const x=await api('/deriv/lookup?account_id='+encodeURIComponent(la.value.trim()));
      if(!x.found){lo.textContent='Not linked to anyone and no invite issued for it.';return}
      lo.textContent=x.linked?'Linked to '+(x.email||'a TradeLens user')+'.':'Verified, invite '+(x.invite_open?'not used yet.':'already used or removed.');
      if(x.linked||x.invite_open){const ul=el('button','ghost','Unlink so they can verify again');ul.style.marginTop='8px';
        ul.onclick=async()=>{if(!confirm('Unlink this Deriv account? Only do this once you are sure the person is the real owner. Welcome signals already given stay as they are.'))return;
          try{await api('/deriv/unlink','POST',{account_id:la.value.trim()});lo.textContent='Unlinked.';ul.remove()}catch(e){alert(e.message)}};lo.append(document.createElement('br'),ul)}}catch(e){lo.className='err';lo.textContent=e.message}};
    box.append(la,lk,lo);
    box.append(el('h2','','Orders waiting for you'));
    if(!r.open.length)box.append(el('div','mut','None right now.'));
    const money=o=>o.currency==='NGN'?'\u20a6'+Math.round(o.amount_local).toLocaleString():'$'+o.amount_usd;
    r.open.forEach(o=>{
      const d=el('div');d.style.cssText='border-top:1px solid var(--line);padding:8px 0';
      d.append(el('div','hd',o.label+' \u00b7 '+money(o)),el('div','mut',o.email+' \u00b7 '+o.method_label+' \u00b7 ref '+o.ref),
        el('div',o.status==='submitted'?'win':'mut',o.status==='submitted'?'Payment reference from member: '+o.txid:'Member has not sent a payment reference yet'));
      const row=el('div','btns');
      const ap=el('button','','Approve');ap.onclick=async()=>{if(!confirm('Approve '+o.label+' for '+o.email+'?\n\nOnly approve after you have seen the payment arrive. This adds their signals.'))return;try{await api('/billing/order/'+o.id+'/approve','POST');loadBilling(box)}catch(e){alert(e.message)}};
      const rj=el('button','ghost','Reject');rj.onclick=async()=>{const n=prompt('Reason shown to the member (optional):','Payment could not be confirmed');if(n===null)return;try{await api('/billing/order/'+o.id+'/reject','POST',{note:n});loadBilling(box)}catch(e){alert(e.message)}};
      row.append(ap,rj);d.append(row);box.append(d)});
    box.append(el('h2','','Add or remove signals by hand'));
    const em=document.createElement('input');em.placeholder='Member email';const n=document.createElement('input');n.type='number';n.placeholder='Signals (negative to remove)';n.inputMode='numeric';const nt=document.createElement('input');nt.placeholder='Reason (required)';
    const am=el('div','mut');const ab=el('button','ghost','Apply');ab.style.marginTop='8px';
    ab.onclick=async()=>{try{const x=await api('/billing/adjust','POST',{email:em.value,delta:Number(n.value),note:nt.value});am.className='win';am.textContent='Done. New balance: '+x.balance;em.value=n.value=nt.value=''}catch(e){am.className='err';am.textContent=e.message}};
    box.append(em,n,nt,ab,am);
    if(r.recent.length){box.append(el('h2','','Recently decided'));r.recent.forEach(o=>box.append(el('div','mut',o.status+' \u00b7 '+o.label+' \u00b7 '+o.email+' \u00b7 '+o.ref)))}
  }catch(e){box.textContent=e.message}
}
let rsTimer=null;
async function loadResearch(box){
  try{
    const r=await api('/research');box.textContent='';const st=r.state;
    const run=el('button','',st.running?'Running...':'Run forex and gold research');run.disabled=st.running;
    run.onclick=async()=>{if(!confirm('Test the forex and gold strategies on years of Deriv history? This takes several minutes.'))return;
      try{await api('/research','POST');loadResearch(box)}catch(e){alert(e.message)}};
    box.append(el('div','mut','Tests seven fixed strategies built for forex and gold, with spread costs, a held-out later period and a wider-spread stress test. Nothing here is shown to members.'),run);
    if(st.running)box.append(el('div','mut','Progress: '+st.done+' of '+st.total+' symbols'+(st.current?' ('+st.current+')':'')+'...'));
    if(st.error)box.append(el('div','err',st.error));
    clearTimeout(rsTimer);if(st.running)rsTimer=setTimeout(()=>loadResearch(box),5000);
    const x=r.result;if(!x){box.append(el('div','mut','No results yet.'));return}
    box.append(el('h2','',x.tested+' combinations tested, '+x.passed+' passed every check'));
    box.append(el('div','mut','On random data with no edge, about 1 full run in 30 still shows a false pass. A pass is a candidate to confirm, not proof.'));
    const nm=g=>g==='metal'?'Gold':'Forex',f=v=>v===null||v===undefined?'-':sg(v);
    x.rows.slice(0,14).forEach(w=>{
      const d=el('div',w.passed?'win':'mut',(w.passed?'PASS \u00b7 ':'')+w.label+' \u00b7 '+nm(w.group)+' \u00b7 '+w.rr+'R: '+w.n+' trades, average '+f(w.avg_r)+'R (t='+(w.t===null?'-':w.t)+'), first 60% '+f(w.train_avg)+', last 40% '+f(w.test_avg)+', wider spread '+f(w.stress_avg)+(w.group==='forex'?', positive on '+w.pairs_positive+' of '+w.pairs+' pairs':'')+(w.passed?'':'. Fails: '+w.why_not[0]));
      d.style.marginTop='8px';box.append(d)});
    box.append(el('div','mut','Spreads assumed (price units): '+Object.entries(x.spreads).map(([k,v])=>k+' '+v).join(', ')+'. History (H1 days): '+Object.entries(x.history).map(([k,v])=>k+' '+(v.H1?v.H1.days:'-')).join(', ')+'.'));
  }catch(e){box.textContent=e.message}
}
async function loadBacktest(box){
  try{
    const r=await api('/backtest');box.textContent='';
    const st=r.state;
    const run=el('button','',st.running?'Running...':'Run signal backtest');run.disabled=st.running;
    run.onclick=async()=>{if(!confirm('Test the signal setups on about 50 days of Deriv history for every symbol? This takes a few minutes.'))return;
      try{await api('/backtest','POST');loadBacktest(box)}catch(e){alert(e.message)}};
    box.append(el('div','mut','Tests four rule-based setups (EMA pullback, squeeze breakout, 20-bar breakout, range reversal) as Scalp, Day and Swing, with costs and no overlapping trades. Results only; nothing here is shown to members.'),run);
    if(st.running)box.append(el('div','mut','Progress: '+st.done+' of '+st.total+' symbols'+(st.current?' ('+st.current+')':'')+'...'));
    if(st.error)box.append(el('div','err',st.error));
    clearTimeout(btTimer);if(st.running)btTimer=setTimeout(()=>loadBacktest(box),5000);
    if(!r.run||!r.rows){box.append(el('div','mut','No results yet.'));return}
    box.append(el('h2','','Pooled within each market (best average R first). Markets are never mixed.'));
    r.pooled.slice(0,16).forEach(x=>box.append(el('div','mut',(x.market==='metal'?'Gold':x.market==='forex'?'Forex':'Synthetic')+' \u00b7 '+STY[x.style]+' \u00b7 '+SET[x.setup]+' \u00b7 target '+x.rr+'R: '+x.n+' trades on '+x.symbols+' symbols ('+x.per_day_all.toFixed(1)+'/day in total), hit rate '+pct(x.hit_rate)+' vs break-even '+pct(x.be_rate)+', average '+sg(x.avg_r)+'R'+(x.t_pooled!==null?' (t='+x.t_pooled.toFixed(1)+')':'')+', positive in both halves on '+x.stable_symbols+' symbols')));
    box.append(el('h2','','Strongest single symbols'));
    r.best.forEach(x=>box.append(el('div','mut',x.name+' \u00b7 '+STY[x.style]+' \u00b7 '+SET[x.setup]+' \u00b7 '+x.rr+'R: '+x.n+' trades, average '+sg(x.avg_r)+'R (halves '+sg(x.avg_r_h1)+' / '+sg(x.avg_r_h2)+'), t='+x.t_stat.toFixed(1))));
    if(r.share_t_over_2!==null)box.append(el('div','mut','Of '+r.tested_combinations+' tested combinations, '+pct(r.share_t_over_2)+' score t above 2. If nothing works, chance alone gives about 2 to 3 percent, so a few strong-looking rows prove nothing.'));
  }catch(e){box.textContent=e.message}
}
async function loadRadarInfo(box){
  try{
    const r=await api('/radar');box.textContent='';
    box.append(el('div','mut','Claude analyses logged: '+r.global.n+' ('+r.global.trade+' with a trade). Last scan: '+(r.scan_age===null?'not yet':r.scan_age+' s ago')+'.'));
    r.rows.forEach(x=>{
      const h=x.history,te=h&&h.time_effect;
      const hist=h?(h.span_days+' days of history; '+(te&&te.significant?'time effect found, best hours (UTC) '+te.best_hours.join(', '):(te&&te.tested?'no meaningful time effect':'still building'))):'history not built yet';
      box.append(el('div','mut',x.name+': '+hist+'; analyses '+x.analyses.n+(x.analyses.rate!==null?' ('+Math.round(x.analyses.rate*100)+'% trade)':'')+(x.now?'; now readiness '+x.now.readiness+', '+x.now.regime:'')));
    });
  }catch(e){box.textContent=e.message}
}
async function load(){try{render(await api('/overview'))}catch(e){$('root').textContent='';$('root').append(el('div','err',e.message),el('p','mut','This page is for admins only.'))}}
load();
</script>
</body>
</html>
