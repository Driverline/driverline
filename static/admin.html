<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TradeLens Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040a1b">
<link rel="icon" href="/favicon-48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/theme.css">
<script src="/auth.js"></script>
</head>
<body>
<header><a class="brand" href="/"><img src="/logo-mark.png" alt=""><span><b>Trade<i>Lens</i></b><small>by Driverline</small></span></a></header>
<main id="root"><span class="mut">Loading...</span></main>
<script>
const $=id=>document.getElementById(id);let pending=null;
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function kv(k,v,c){const d=el('div','kv');d.append(el('span','',k),el('span',c||'',v));return d}
function opt(s,v,t){const o=document.createElement('option');o.value=v;o.textContent=t;s.append(o)}
async function api(path,method,body,base){
  const r=await fetch((base||'/api/admin')+path,{method:method||'GET',headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d;
}
function note(text,cls){const n=$('note');n.className=cls||'mut';n.textContent=text}
async function act(fn){try{await fn();await load()}catch(e){note(e.message,'err')}}
function linkBox(link,mins){
  const b=$('linkbox');b.textContent='';b.append(el('div','mut','Send this link to the member. It works once and expires in '+mins+' minutes.'));
  const i=document.createElement('input');i.readOnly=true;i.value=link;i.onfocus=()=>i.select();b.append(i);
  const c=el('button','','Copy link');c.style.marginTop='8px';c.onclick=async()=>{try{await navigator.clipboard.writeText(link);c.textContent='Copied'}catch(e){i.select()}};b.append(c);
  b.scrollIntoView({behavior:'smooth'});
}
function render(d){
  const root=$('root');root.textContent='';
  root.append(el('div','mut','Signed in as '+d.me),el('div','',''));
  const n=el('div','mut');n.id='note';root.append(n);
  const s=el('div','card');s.append(el('h2','','Overview'),kv('Members',d.totals.users),kv('Paid (member)',d.totals.member),kv('Free',d.totals.free),kv('AI analyses used today',d.totals.ai_today),
    kv('Reset emails',d.mail_configured?'sending by email':'not set up: use "Reset link" below','mut'));root.append(s);
  const lb=el('div','card');lb.id='linkbox';lb.hidden=true;root.append(lb);

  const inv=el('div','card');inv.append(el('h2','','Invite codes'));
  const t=document.createElement('select');opt(t,'free','free');opt(t,'member','member');
  const u=document.createElement('input');u.type='number';u.value=10;u.min=1;u.max=1000;
  const c=document.createElement('input');c.placeholder='Custom code (optional)';
  const row=el('div','row');const a=el('div'),b=el('div');a.append(el('label','','Tier'),t);b.append(el('label','','Uses'),u);row.append(a,b);
  const mk=el('button','','Create invite');mk.style.marginTop='10px';
  mk.onclick=()=>act(async()=>{const r=await api('/invites','POST',{tier:t.value,uses:Number(u.value),code:c.value});pending=['New code: '+r.code+' ('+r.tier+', '+r.uses+' uses)','win']});
  inv.append(row,el('label','','Code'),c,mk);
  d.invites.forEach(i=>{const r=el('div','kv');r.append(el('span','',i.code+' · '+i.tier+' · '+i.uses_left+' left'));
    const x=el('button','ghost','Delete');x.style.width='auto';x.style.padding='6px 12px';x.onclick=()=>act(()=>api('/invites/'+encodeURIComponent(i.code),'DELETE'));r.append(x);inv.append(r)});
  if(!d.invites.length)inv.append(el('div','mut','No active codes.'));
  root.append(inv);

  const us=el('div');us.append(el('h2','','Members'));
  d.users.forEach(m=>{
    const card=el('div','card'),me=m.id===d.my_id;
    const h=el('div','hd');h.append(el('span','',m.email+(me?' (you)':'')),el('span',m.blocked?'loss':'mut',m.blocked?'blocked':m.tier));
    card.append(h,kv('AI today',m.used_today+' / '+m.limit),kv('Joined',m.created_at.slice(0,10)));
    const tier=document.createElement('select');['free','member','admin'].forEach(x=>opt(tier,x,x));tier.value=m.tier;tier.disabled=me;tier.style.marginTop='8px';
    tier.onchange=()=>act(()=>api('/users/'+m.id+'/tier','POST',{tier:tier.value}));card.append(tier);
    const btns=el('div','btns');
    const bl=el('button','ghost',m.blocked?'Unblock':'Block');bl.disabled=me;bl.onclick=()=>act(()=>api('/users/'+m.id+'/block','POST',{blocked:!m.blocked}));
    const rs=el('button','ghost','Reset link');rs.onclick=async()=>{try{const r=await api('/users/'+m.id+'/reset-link','POST');$('linkbox').hidden=false;linkBox(r.link,r.valid_minutes)}catch(e){note(e.message,'err')}};
    btns.append(bl,rs);card.append(btns);us.append(card)});
  root.append(us);

  const v=el('div','card');v.append(el('h2','','Deriv symbol check'));
  const vb=el('button','','Check all symbols');const vr=el('div');
  vb.onclick=async()=>{vr.textContent='Checking...';try{const r=await api('/verify','GET',null,'/api');vr.textContent='';
    Object.entries(r).forEach(([k,x])=>vr.append(kv(k+' ('+x.code+')',x.found?'found':'NOT FOUND',x.found?'win':'loss')))}catch(e){vr.textContent=e.message}};
  v.append(vb,vr);root.append(v);
  const bt=el('div','card');bt.append(el('h2','','Signal backtest'));const bb=el('div');bt.append(bb);root.append(bt);loadBacktest(bb);
  const ri=el('div','card');ri.append(el('h2','','Smart Analysis Timing insights'));const rb=el('div');rb.append(el('span','mut','Loading...'));ri.append(rb);root.append(ri);loadRadarInfo(rb);
  if(pending){note(pending[0],pending[1]);pending=null}
}
const STY={scalp:'Scalp (M5)',day:'Day (M15)',swing:'Swing (H1)'},SET={ema_pullback:'EMA pullback',squeeze_breakout:'Squeeze breakout',range_breakout:'20-bar breakout',range_reversal:'Range reversal'};
const pct=x=>Math.round(x*100)+'%',sg=x=>(x>=0?'+':'')+x.toFixed(2);
let btTimer=null;
async function loadBacktest(box){
  try{
    const r=await api('/backtest');box.textContent='';
    const st=r.state;
    const run=el('button','',st.running?'Running...':'Run signal backtest');run.disabled=st.running;
    run.onclick=async()=>{if(!confirm('Test the signal setups on about 50 days of Deriv history for every symbol? This takes a few minutes.'))return;
      try{await api('/backtest','POST');loadBacktest(box)}catch(e){alert(e.message)}};
    box.append(el('div','mut','Tests four rule-based setups (EMA pullback, squeeze breakout, 20-bar breakout, range reversal) as Scalp, Day and Swing, with costs and no overlapping trades. Results only; nothing here is shown to members.'),run);
    if(st.running)box.append(el('div','mut','Progress: '+st.done+' of '+st.total+' symbols'+(st.current?' ('+st.current+')':'')+'...'));
    if(st.error)box.append(el('div','err',st.error));
    clearTimeout(btTimer);if(st.running)btTimer=setTimeout(()=>loadBacktest(box),5000);
    if(!r.run||!r.rows){box.append(el('div','mut','No results yet.'));return}
    box.append(el('h2','','Pooled across symbols (best average R first)'));
    r.pooled.slice(0,10).forEach(x=>box.append(el('div','mut',STY[x.style]+' \u00b7 '+SET[x.setup]+' \u00b7 target '+x.rr+'R: '+x.n+' trades on '+x.symbols+' symbols ('+x.per_day_all.toFixed(1)+'/day in total), hit rate '+pct(x.hit_rate)+' vs break-even '+pct(x.be_rate)+', average '+sg(x.avg_r)+'R, positive in both halves on '+x.stable_symbols+' symbols')));
    box.append(el('h2','','Strongest single symbols'));
    r.best.forEach(x=>box.append(el('div','mut',x.name+' \u00b7 '+STY[x.style]+' \u00b7 '+SET[x.setup]+' \u00b7 '+x.rr+'R: '+x.n+' trades, average '+sg(x.avg_r)+'R (halves '+sg(x.avg_r_h1)+' / '+sg(x.avg_r_h2)+'), t='+x.t_stat.toFixed(1))));
    if(r.share_t_over_2!==null)box.append(el('div','mut','Of '+r.tested_combinations+' tested combinations, '+pct(r.share_t_over_2)+' score t above 2. If nothing works, chance alone gives about 2 to 3 percent, so a few strong-looking rows prove nothing.'));
  }catch(e){box.textContent=e.message}
}
async function loadRadarInfo(box){
  try{
    const r=await api('/radar');box.textContent='';
    box.append(el('div','mut','Claude analyses logged: '+r.global.n+' ('+r.global.trade+' with a trade). Last scan: '+(r.scan_age===null?'not yet':r.scan_age+' s ago')+'.'));
    r.rows.forEach(x=>{
      const h=x.history,te=h&&h.time_effect;
      const hist=h?(h.span_days+' days of history; '+(te&&te.significant?'time effect found, best hours (UTC) '+te.best_hours.join(', '):(te&&te.tested?'no meaningful time effect':'still building'))):'history not built yet';
      box.append(el('div','mut',x.name+': '+hist+'; analyses '+x.analyses.n+(x.analyses.rate!==null?' ('+Math.round(x.analyses.rate*100)+'% trade)':'')+(x.now?'; now readiness '+x.now.readiness+', '+x.now.regime:'')));
    });
  }catch(e){box.textContent=e.message}
}
async function load(){try{render(await api('/overview'))}catch(e){$('root').textContent='';$('root').append(el('div','err',e.message),el('p','mut','This page is for admins only.'))}}
load();
</script>
</body>
</html>
