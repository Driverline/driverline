<script>
const $=id=>document.getElementById(id);let pending=null;
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function kv(k,v,c){const d=el('div','kv');d.append(el('span','',k),el('span',c||'',v));return d}
function opt(s,v,t){const o=document.createElement('option');o.value=v;o.textContent=t;s.append(o)}
async function api(path,method,body,base){
  const r=await fetch((base||'/api/admin')+path,{method:method||'GET',headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.detail||('HTTP '+r.status));return d;
}
function note(text,cls){const n=$('note');n.className=cls||'mut';n.textContent=text}
async function act(fn){try{await fn();await load()}catch(e){note(e.message,'err')}}
function linkBox(link,mins){
  const b=$('linkbox');b.textContent='';b.append(el('div','mut','Send this link to the member. It works once and expires in '+mins+' minutes.'));
  const i=document.createElement('input');i.readOnly=true;i.value=link;i.onfocus=()=>i.select();b.append(i);
  const c=el('button','','Copy link');c.style.marginTop='8px';c.onclick=async()=>{try{await navigator.clipboard.writeText(link);c.textContent='Copied'}catch(e){i.select()}};b.append(c);
  b.scrollIntoView({behavior:'smooth'});
}
function render(d){
  const root=$('root');root.textContent='';
  root.append(el('div','mut','Signed in as '+d.me),el('div','',''));
  const n=el('div','mut');n.id='note';root.append(n);
  const s=el('div','card');s.append(el('h2','','Overview'),kv('Members',d.totals.users),kv('Paid (member)',d.totals.member),kv('Free',d.totals.free),kv('AI analyses used today',d.totals.ai_today),
    kv('Reset emails',d.mail_configured?'sending by email':'not set up: use "Reset link" below','mut'));root.append(s);
  const lb=el('div','card');lb.id='linkbox';lb.hidden=true;root.append(lb);
  const gr=el('div','card');gr.append(el('h2','','Growth: which ads bring members'));const grb=el('div');gr.append(grb);root.append(gr);loadGrowth(grb);
  const pt=el('div','card');pt.append(el('h2','','Partner tags: who is really tagged to you'));const ptb=el('div');pt.append(ptb);root.append(pt);loadPartner(ptb);

  const inv=el('div','card');inv.append(el('h2','','Invite codes'));
  const t=document.createElement('select');opt(t,'free','free');opt(t,'member','member');
  const u=document.createElement('input');u.type='number';u.value=10;u.min=1;u.max=1000;
  const c=document.createElement('input');c.placeholder='Custom code (optional)';
  const row=el('div','row');const a=el('div'),b=el('div');a.append(el('label','','Tier'),t);b.append(el('label','','Uses'),u);row.append(a,b);
  const mk=el('button','','Create invite');mk.style.marginTop='10px';
  mk.onclick=()=>act(async()=>{const r=await api('/invites','POST',{tier:t.value,uses:Number(u.value),code:c.value});pending=['New code: '+r.code+' ('+r.tier+', '+r.uses+' uses)','win']});
  inv.append(row,el('label','','Code'),c,mk);
  d.invites.forEach(i=>{const r=el('div','kv');r.append(el('span','',i.code+' · '+i.tier+' · '+i.uses_left+' left'));
    const x=el('button','ghost','Delete');x.style.width='auto';x.style.padding='6px 12px';x.onclick=()=>act(()=>api('/invites/'+encodeURIComponent(i.code),'DELETE'));r.append(x);inv.append(r)});
  if(!d.invites.length)inv.append(el('div','mut','No active codes.'));
  root.append(inv);

  const us=el('div');us.append(el('h2','','Members'));
  d.users.forEach(m=>{
    const card=el('div','card'),me=m.id===d.my_id;
    const h=el('div','hd');h.append(el('span','',m.email+(me?' (you)':'')),el('span',m.blocked?'loss':'mut',m.blocked?'blocked':m.tier));
    card.append(h,kv('AI today',m.used_today+' / '+m.limit),kv('Joined',m.created_at.slice(0,10)));
    const tier=document.createElement('select');['free','member','admin'].forEach(x=>opt(tier,x,x));tier.value=m.tier;tier.disabled=me;tier.style.marginTop='8px';
    tier.onchange=()=>act(()=>api('/users/'+m.id+'/tier','POST',{tier:tier.value}));card.append(tier);
    const btns=el('div','btns');
    const bl=el('button','ghost',m.blocked?'Unblock':'Block');bl.disabled=me;bl.onclick=()=>act(()=>api('/users/'+m.id+'/block','POST',{blocked:!m.blocked}));
    const rs=el('button','ghost','Reset link');rs.onclick=async()=>{try{const r=await api('/users/'+m.id+'/reset-link','POST');$('linkbox').hidden=false;linkBox(r.link,r.valid_minutes)}catch(e){note(e.message,'err')}};
    btns.append(bl,rs);card.append(btns);us.append(card)});
  root.append(us);

  const v=el('div','card');v.append(el('h2','','Deriv symbol check'));
  const vb=el('button','','Check all symbols');const vr=el('div');
  vb.onclick=async()=>{vr.textContent='Checking...';try{const r=await api('/verify','GET',null,'/api');vr.textContent='';
    Object.entries(r).forEach(([k,x])=>vr.append(kv(k+' ('+x.code+')',x.found?'found':'NOT FOUND',x.found?'win':'loss')))}catch(e){vr.textContent=e.message}};
  v.append(vb,vr);root.append(v);
  const bt=el('div','card');bt.append(el('h2','','Signal backtest'));const bb=el('div');bt.append(bb);root.append(bt);loadBacktest(bb);
  const bl=el('div','card');bl.append(el('h2','','Billing and signal credits'));const blb=el('div');bl.append(blb);root.append(bl);loadBilling(blb);
  const rs=el('div','card');rs.append(el('h2','','Forex and gold research'));const rsb=el('div');rs.append(rsb);root.append(rs);loadResearch(rsb);
  const en=el('div','card');en.append(el('h2','','AI signal engine research (Step and Range Break)'));const enb=el('div');en.append(enb);root.append(en);loadEngine(enb);
  const ri=el('div','card');ri.append(el('h2','','Smart Analysis Timing insights'));const rb=el('div');rb.append(el('span','mut','Loading...'));ri.append(rb);root.append(ri);loadRadarInfo(rb);
  if(pending){note(pending[0],pending[1]);pending=null}
}

async function loadPartner(box){
  box.textContent='';
  const qs=new URLSearchParams(location.search),pm=qs.get('partner');
  if(pm){const n=el('div',pm==='error'?'err':'win');
    n.textContent=pm==='probe'?'Test finished. The result is shown under Test with real client IDs.':pm==='done'?('Check finished: '+qs.get('checked')+' checked, '+qs.get('confirmed')+' confirmed, '+qs.get('not_tagged')+' not tagged, '+qs.get('unknown')+' not recognised by Deriv, '+(qs.get('no_client_id')||0)+' without a Deriv client ID yet.'):(qs.get('msg')||'The check did not complete.');
    box.append(n);history.replaceState(null,'',location.pathname)}
  let s;try{s=await api('/partner/summary')}catch(e){box.append(el('div','err',e.message));return}
  box.append(el('div','mut','A Deriv login only proves a person signed in. An account counts as confirmed only after Deriv\u2019s partner records say it is tagged to you.'));
  box.append(kv('Confirmed',s.counts.confirmed),kv('Waiting to be checked (provisional)',s.counts.provisional),kv('Not tagged',s.counts.not_tagged));
  box.append(kv('Values sent to Deriv from your partner link',s.values_carried.length?s.values_carried.join(', '):'none found. Check the link in Deriv settings above'));
  box.append(kv('Member client IDs captured',s.captured+(s.capture_on?' (capture on)':' (capture off)')));
  box.append(kv('Create-account button',s.signup_via_oauth?'Deriv OAuth sign-up':'your plain partner link'),kv('Trading limited to confirmed accounts',s.gate?'yes':'no'));
  if(s.last_check){const l=s.last_check;box.append(el('div','mut','Last check '+new Date(l.at*1000).toLocaleString()+': '+l.checked+' checked, '+l.confirmed+' confirmed, '+l.not_tagged+' not tagged, '+l.unknown+' not recognised, '+(l.no_client_id||0)+' without a client ID.'))}
  const go=el('button','','Check with Deriv (sign in as the partner)');go.style.marginTop='10px';go.onclick=()=>{location.href='/auth/deriv/partner/start'};box.append(go);
  if(s.token_set){const k=el('button','ghost','Check now (saved partner token)');k.style.marginTop='8px';k.onclick=async()=>{k.disabled=true;try{const d=await api('/partner/check','POST');alert('Checked '+d.checked+': '+d.confirmed+' confirmed, '+d.not_tagged+' not tagged, '+d.unknown+' not recognised.');loadPartner(box)}catch(e){alert(e.message);k.disabled=false}};box.append(k)}
  box.append(el('h2','','Test with real client IDs'));
  box.append(el('div','mut','Paste any IDs to test: Partners Hub client IDs (long, like 019e98b8-381f-...) or TradeLens account IDs (like ROT12345678). Deriv says whether each is recognised and tagged to you. The test also shows the IDs Deriv gives for your own login.'));
  const pi=document.createElement('textarea');pi.rows=3;pi.placeholder='One client ID per line';pi.style.width='100%';box.append(pi);
  const pb=el('button','','Run test (sign in as the partner)');pb.style.marginTop='8px';
  pb.onclick=()=>{location.href='/auth/deriv/partner/start?test=1&probe='+encodeURIComponent(pi.value.trim().replace(/\s+/g,','))};box.append(pb);
  if(s.last_probe){const p=s.last_probe,c=el('div','card');c.append(el('h2','','Last test '+new Date(p.at*1000).toLocaleString()));
    c.append(kv('Token fields',p.token_keys.join(', ')+(p.token_scope?' (scope: '+p.token_scope+')':'')));
    if(p.jwt_claims)c.append(kv('Token claims',JSON.stringify(p.jwt_claims)));
    if(p.userinfo){if(p.userinfo.error)c.append(kv('User info',p.userinfo.error));else{
      c.append(kv('User info','status '+p.userinfo.status+(p.userinfo.keys.length?'; fields: '+p.userinfo.keys.join(', '):'')));
      Object.entries(p.userinfo.values||{}).forEach(([k,v])=>c.append(kv('  '+k,v)))}}
    if(p.check){if(p.check.error)c.append(kv('Tag check',p.check.error));else{
      Object.entries(p.check.clients).forEach(([id,v])=>c.append(kv((v.own?'Your login '+v.own+': ':'Client ')+id,
        !v.resolved?'not recognised by Deriv':(v.is_tagged?'TAGGED to you':'not tagged to you')+(v.display_id?' ('+v.display_id+')':''))));
      if(p.check.raw)c.append(el('div','mut','Deriv answered: '+p.check.raw))}}
    box.append(c)}
  box.append(el('h2','','Or paste from Partners Hub'));
  box.append(el('div','mut','In Partners Hub, open Active Trader Breakdown, copy the client IDs, and paste them here. Matching accounts become confirmed.'));
  const ta=document.createElement('textarea');ta.rows=4;ta.placeholder='Paste client IDs or the whole table';ta.style.width='100%';box.append(ta);
  const mt=el('button','','Mark matches as confirmed');mt.style.marginTop='8px';const mo=el('div','mut');
  mt.onclick=async()=>{mo.textContent='Working...';try{const d=await api('/partner/paste','POST',{text:ta.value});mo.textContent=d.matched+' of '+d.pasted+' pasted IDs matched an account here.'+(d.matched<d.pasted?' Unmatched sample: '+d.unmatched_sample.join(', ')+'. If your real clients never match, the IDs in Partners Hub differ from the account IDs TradeLens sees. Send me one example of each.':'');loadPartner(box)}catch(e){mo.textContent=e.message}};
  box.append(mt,mo);
  box.append(el('h2','','Accounts waiting or not tagged'));
  try{const r=await api('/partner/list');const rows=r.rows.filter(x=>x.status!=='confirmed');
    if(!rows.length)box.append(el('div','mut','Nothing waiting.'));
    rows.forEach(x=>{const c=el('div','card');
      c.append(el('h2','',x.account_id+' \u00b7 '+x.status),kv('Member',x.email||'not signed up yet'),kv('Deriv client ID',x.client_uuid||'not captured yet'),kv('Seen',new Date(x.first_seen*1000).toLocaleString()+' via '+(x.source||'')));
      const sent=x.attribution&&x.attribution.sent?Object.keys(x.attribution.sent).join(', '):'';if(sent)c.append(kv('Partner values sent',sent));
      if(x.note)c.append(el('div','mut',x.note));
      [['confirmed','Mark confirmed'],['not_tagged','Mark not tagged']].forEach(([st,lb])=>{if(st===x.status)return;const b=el('button','ghost',lb);b.style.cssText='width:auto;padding:6px 10px;margin:6px 6px 0 0';
        b.onclick=async()=>{try{await api('/partner/set','POST',{account_id:x.account_id,status:st});loadPartner(box)}catch(e){alert(e.message)}};c.append(b)});
      box.append(c)})}catch(e){box.append(el('div','err',e.message))}
}
async function loadGrowth(box){
  box.textContent='';
  // 1. tracked-link builder
  box.append(el('div','mut','Make a tracked link for each ad, creator or post. Use a different content tag for each video, so you can see which one wins.'));
  const f={};[['source','Source (tiktok, instagram, youtube, creator name)','tiktok'],['campaign','Campaign (e.g. rules-before-clicks)','launch'],['content','Content / video (e.g. hook-a-20s)','hook-a']].forEach(([k,ph,v])=>{
    const i=document.createElement('input');i.placeholder=ph;i.value=v;f[k]=i;box.append(i)});
  const out=document.createElement('input');out.readOnly=true;out.onfocus=()=>out.select();
  const mk=()=>{const q=new URLSearchParams();q.set('utm_source',f.source.value.trim()||'direct');q.set('utm_medium','paid');
    q.set('utm_campaign',f.campaign.value.trim()||'none');q.set('utm_content',f.content.value.trim()||'none');
    out.value=location.origin+'/login.html?'+q.toString()};
  Object.values(f).forEach(i=>i.oninput=mk);mk();
  const cp=el('button','','Copy link');cp.style.marginTop='8px';cp.onclick=async()=>{try{await navigator.clipboard.writeText(out.value);cp.textContent='Copied'}catch(e){out.select()}};
  box.append(el('label','','Tracked link'),out,cp);
  // 2. funnel
  const days=document.createElement('select');[7,30,90].forEach(n=>opt(days,n,'Last '+n+' days'));days.value=30;days.style.marginTop='12px';
  const res=el('div');box.append(days,res);
  const pct=(a,b)=>b?Math.round(100*a/b)+'%':'-';
  const show=async()=>{res.textContent='Loading...';
    try{const d=await api('/funnel?days='+days.value);res.textContent='';
      const t=d.totals;
      res.append(el('h2','','All campaigns'),kv('Visits',t.visits),kv('Signups',t.signups+' ('+pct(t.signups,t.visits)+' of visits)'),
        kv('Verified with Deriv',t.verified),kv('Opened a setup',t.opened+' ('+pct(t.opened,t.signups)+' of signups)'),
        kv('Connected Deriv to trade',t.connected),kv('Placed a trade',t.traded+' ('+pct(t.traded,t.signups)+' of signups)'));
      if(d.untracked_users)res.append(el('div','mut',d.untracked_users+' members joined before tracking started or without a campaign link, so they are not in the table below.'));
      d.rows.forEach(r=>{const c=el('div','card');
        c.append(el('h2','',r.source+' / '+r.campaign+' / '+r.content),kv('Visits',r.visits),kv('Signups',r.signups+' ('+pct(r.signups,r.visits)+')'),
          kv('Verified with Deriv',r.verified),kv('Opened a setup',r.opened),kv('Connected Deriv',r.connected),kv('Placed a trade',r.traded));res.append(c)});
      if(!d.rows.length)res.append(el('div','mut','No tracked visits yet. Share a tracked link and check back.'));
    }catch(e){res.textContent=e.message}};
  days.onchange=show;show();
}

async function loadEngine(box){
  try{
    const r=await api('/engine');box.textContent='';const st=r.state;
    box.append(el('div','mut','Research only: stores and checks Deriv history, then measures simple baselines on development and validation data. The untouched test period is never used here. Nothing on this card is shown to members and no signal is published from it.'));
    const run=(label,path,body,confirmText)=>{const b=el('button',st.running?'ghost':'',label);b.disabled=st.running;b.style.marginTop='8px';
      b.onclick=async()=>{if(confirmText&&!confirm(confirmText))return;try{const x=await api('/engine'+path,'POST',body);if(!x.started)alert('Another job is already running.');loadEngine(box)}catch(e){alert(e.message)}};return b};
    box.append(run('Probe Deriv symbols and data depth','/probe',{}));
    if(st.running)box.append(el('div','mut','Running: '+st.job+(st.detail?' ('+st.detail+')':'')+'...'));
    if(st.error)box.append(el('div','err',st.error));
    clearTimeout(enTimer);if(st.running)enTimer=setTimeout(()=>loadEngine(box),4000);
    const dt=t=>t?new Date(t*1000).toISOString().slice(0,10):'-';
    if(r.probe){
      box.append(el('h2','','What Deriv offers ('+dt(r.probe.checked_at)+')'));
      Object.entries(r.probe.symbols).forEach(([code,s])=>{
        const d=s.depth||{};const dep=['D1','H1','M5'].map(k=>d[k]?(d[k].error?k+' error':k+' '+d[k].days+'d'+(d[k].capped_by_request?'+':'')):'').filter(Boolean).join(', ');
        const tk=s.ticks&&s.ticks.n?', ticks every '+s.ticks.median_gap_seconds+'s, steps '+(s.ticks.top_step_sizes||[]).map(x=>x.size+' ('+Math.round(x.share*100)+'%)').join('/')+(s.tick_depth&&s.tick_depth.hours!==undefined?'; Deriv serves about '+s.tick_depth.hours+' hours of ticks (stopped: '+s.tick_depth.stopped+')':''):'';
        box.append(el('div',s.listed?'mut':'warn',code+' \u00b7 '+(s.display||s.label)+' \u00b7 '+(s.listed?'listed. History: '+dep+tk:'NOT on Deriv\'s list (the expected code is wrong or unavailable)')))});
    }
    box.append(el('h2','','Download and check history'));
    const sy=document.createElement('input');sy.placeholder='Deriv symbol code, for example stpRNG';
    const dy=document.createElement('input');dy.type='number';dy.value=180;dy.placeholder='Days of candles (7 to 365)';dy.inputMode='numeric';
    const td=document.createElement('input');td.type='number';td.value=3;td.placeholder='Days of tick statistics (0 to 30)';td.inputMode='numeric';
    box.append(sy,dy,td,run('Download and validate','/ingest',null,null));
    box.lastChild.onclick=async()=>{try{const x=await api('/engine/ingest','POST',{symbol:sy.value.trim(),days:Number(dy.value),tick_days:Number(td.value)});if(!x.started)alert('Another job is already running.');loadEngine(box)}catch(e){alert(e.message)}};
    box.append(el('h2','','Stored datasets'));
    if(!r.datasets.length)box.append(el('div','mut','None yet.'));
    r.datasets.forEach(d=>{
      const c=el('div');c.style.cssText='border-top:1px solid var(--line);padding:8px 0';
      c.append(el('div',d.status==='valid'?'win':d.status==='warn'?'warn':'loss',d.symbol+' \u00b7 '+d.status.toUpperCase()+' \u00b7 '+d.rows.toLocaleString()+' M5 bars \u00b7 '+dt(d.first)+' to '+dt(d.last)+' \u00b7 checksum '+d.sha),
        el('div','mut','Tick statistics on '+Math.round((d.tick_stats_share||0)*100)+'% of bars'+(d.reasons.length?'. '+d.reasons.join('; '):'')));
      const row=el('div','btns');row.append(run('Validate again','/validate',{symbol:d.symbol}));
      if(d.status!=='invalid')row.append(run('Run baselines','/baselines',{symbol:d.symbol},'Run the baseline study on '+d.symbol+'? It uses development and validation data only.'));
      if(d.status!=='invalid')row.append(run('Run diagnostics','/diagnostics',{symbol:d.symbol,n_surrogates:40},'Run the Phase 3b diagnostics on '+d.symbol+'? Outcome breakdown, entry-delay and cost tests, block-shuffled copies and time scales. Development and validation data only; it takes a few minutes.'));
      row.append(run('Tick structure (last 24 h)','/ticks',{symbol:d.symbol},'Download the last 24 hours of ticks for '+d.symbol+' and analyse them?'));
      if(d.status!=='invalid')row.append(run('Run structure tests','/structure',{symbol:d.symbol,n_surrogates:80},'Run the pre-registered structure tests on '+d.symbol+'? It registers the hypotheses first, uses development and validation data only, and takes a few minutes.'));
      c.append(row);box.append(c)});
    box.append(el('h2','','Structure tests (pre-registered, Holm-adjusted, must replicate in both periods)'));
    if(!(r.structure||[]).length)box.append(el('div','mut','No structure runs yet.'));
    (r.structure||[]).forEach(u=>{
      box.append(el('div','mut',u.symbol+' \u00b7 '+(u.family==='range_break'?'Range Break':'Step Index')+' \u00b7 run '+u.id+' \u00b7 '+dt(u.finished_at)+' \u00b7 '+u.tests_per_segment+' tests per period, '+u.n_surrogates+' shuffled copies'));
      box.append(el('div',u.replicated.length?'warn':'mut',u.verdict));
      u.replicated.forEach(x=>{const d=el('div','mut',x.hypothesis+' ('+x.name+'): development '+(x.dev===null?'-':Number(x.dev).toFixed(3))+', validation '+(x.val===null?'-':Number(x.val).toFixed(3))+', adjusted p '+Number(x.dev_p_adj).toExponential(1)+' / '+Number(x.val_p_adj).toExponential(1));d.style.fontSize='13px';box.append(d)})});
    box.append(el('h2','','Diagnostics (would the pattern survive real conditions?)'));
    if(!(r.diagnostics||[]).length)box.append(el('div','mut','No diagnostics runs yet.'));
    (r.diagnostics||[]).forEach(u=>{
      box.append(el('div','mut',u.symbol+' \u00b7 run '+u.id+' \u00b7 '+dt(u.finished_at)+' \u00b7 '+u.n_surrogates+' block-shuffled copies per size'));
      box.append(el('div',u.executable.length?'warn':'mut',u.verdict));
      box.append(el('div','mut','Average result at the 1.5R target after costs, * = 95% interval above zero. Entry delay in 5-minute bars:'));
      u.delay.forEach(x=>{const d=el('div','mut',x.baseline+', entry '+x.delay+' bar'+(x.delay===1?'':'s')+' late: development '+x.dev+' | validation '+x.val);d.style.fontSize='13px';box.append(d)});
      box.append(el('div','mut','Where the 1.5R result comes from (share of trades, average result): target / stop / timeout, and average bars held'));
      u.decomposition.forEach(x=>{const d=el('div','mut',x.baseline+': development '+x.dev.target+' / '+x.dev.stop+' / '+x.dev.timeout+', '+(x.dev.avg_bars||0).toFixed(1)+' bars | validation '+x.val.target+' / '+x.val.stop+' / '+x.val.timeout+', '+(x.val.avg_bars||0).toFixed(1)+' bars');d.style.fontSize='13px';box.append(d)});
      box.append(el('div','mut','Real result against block-shuffled copies (z score; large only if the memory is shorter than the block):'));
      [1,6,12,48].forEach(B=>{const row=u.blocks.filter(x=>x.block===B).map(x=>x.baseline+' '+x.segment+' '+Number(x.z).toFixed(1)).join(', ');if(row){const d=el('div','mut','Blocks of '+B+' bar'+(B===1?'':'s')+': '+row);d.style.fontSize='13px';box.append(d)}});
      box.append(el('div','mut','How often direction reverses when price is sampled every N minutes (development / validation):'));
      const sc=u.scales.map(x=>x.minutes+' min: '+(x.dev===null?'-':Math.round(x.dev*1000)/10)+'% / '+(x.val===null?'-':Math.round(x.val*1000)/10)+'%').join(' | ');
      const dd=el('div','mut',sc);dd.style.fontSize='13px';box.append(dd)});
    box.append(el('h2','','Tick-level structure (Deriv serves the last 24 hours only)'));
    if(!(r.tick_runs||[]).length)box.append(el('div','mut','No tick runs yet.'));
    (r.tick_runs||[]).forEach(u=>{
      if(u.note){box.append(el('div','mut',u.symbol+': '+u.note));return}
      box.append(el('div','mut',u.symbol+' \u00b7 '+(u.ticks||0).toLocaleString()+' ticks over '+u.hours+' h \u00b7 runs z '+(u.runs_z===null?'-':Number(u.runs_z).toFixed(1))+' \u00b7 autocorrelation lag 1 '+(u.acf?Number(u.acf.lag1).toFixed(3):'-')));
      const vr=Object.entries(u.variance_ratio||{}).map(([q,v])=>q+' ticks: '+(v===null?'-':Number(v).toFixed(2))).join(', ');
      const sc=(u.scales||[]).map(x=>x.seconds+' s: '+Math.round(x.p_reverse*1000)/10+'% (z '+Number(x.z).toFixed(1)+')').join(' | ');
      const a=el('div','mut','Variance ratio: '+vr+'. Reversal rate by bar size: '+sc);a.style.fontSize='13px';box.append(a)});
    box.append(el('h2','','Baseline results (1.5R target, average result after costs with 95% interval)'));
    if(!r.runs.length)box.append(el('div','mut','No baseline runs yet.'));
    r.runs.forEach(u=>{
      box.append(el('div','mut',u.symbol+' \u00b7 run '+u.id+' \u00b7 '+dt(u.finished_at)));
      u.lines.forEach(l=>{const d=el('div','mut',l.baseline+': development '+l.dev+' | validation '+l.val);d.style.fontSize='13px';box.append(d)});
      box.append(el('div',u.notable.length?'warn':'mut',u.notable.length?'Stands out: '+u.notable.join('; '):'Nothing stands out: no baseline beat zero in both periods.'))});
  }catch(e){box.textContent=e.message}
}
let rsTimer=null;
async function loadResearch(box){
  try{
    const r=await api('/research');box.textContent='';const st=r.state;
    const run=el('button','',st.running?'Running...':'Run forex and gold research');run.disabled=st.running;
    run.onclick=async()=>{if(!confirm('Test the forex and gold strategies on years of Deriv history? This takes several minutes.'))return;
      try{await api('/research','POST');loadResearch(box)}catch(e){alert(e.message)}};
    box.append(el('div','mut','Tests seven fixed strategies built for forex and gold, with spread costs, a held-out later period and a wider-spread stress test. Nothing here is shown to members.'),run);
    if(st.running)box.append(el('div','mut','Progress: '+st.done+' of '+st.total+' symbols'+(st.current?' ('+st.current+')':'')+'...'));
    if(st.error)box.append(el('div','err',st.error));
    clearTimeout(rsTimer);if(st.running)rsTimer=setTimeout(()=>loadResearch(box),5000);
    const x=r.result;if(!x){box.append(el('div','mut','No results yet.'));return}
    box.append(el('h2','',x.tested+' combinations tested, '+x.passed+' passed every check'));
    box.append(el('div','mut','On random data with no edge, about 1 full run in 30 still shows a false pass. A pass is a candidate to confirm, not proof.'));
    const nm=g=>g==='metal'?'Gold':'Forex',f=v=>v===null||v===undefined?'-':sg(v);
    x.rows.slice(0,14).forEach(w=>{
      const d=el('div',w.passed?'win':'mut',(w.passed?'PASS \u00b7 ':'')+w.label+' \u00b7 '+nm(w.group)+' \u00b7 '+w.rr+'R: '+w.n+' trades, average '+f(w.avg_r)+'R (t='+(w.t===null?'-':w.t)+'), first 60% '+f(w.train_avg)+', last 40% '+f(w.test_avg)+', wider spread '+f(w.stress_avg)+(w.group==='forex'?', positive on '+w.pairs_positive+' of '+w.pairs+' pairs':'')+(w.passed?'':'. Fails: '+w.why_not[0]));
      d.style.marginTop='8px';box.append(d)});
    box.append(el('div','mut','Spreads assumed (price units): '+Object.entries(x.spreads).map(([k,v])=>k+' '+v).join(', ')+'. History (H1 days): '+Object.entries(x.history).map(([k,v])=>k+' '+(v.H1?v.H1.days:'-')).join(', ')+'.'));
  }catch(e){box.textContent=e.message}
}
async function loadBacktest(box){
  try{
    const r=await api('/backtest');box.textContent='';
    const st=r.state;
    const run=el('button','',st.running?'Running...':'Run signal backtest');run.disabled=st.running;
    run.onclick=async()=>{if(!confirm('Test the signal setups on about 50 days of Deriv history for every symbol? This takes a few minutes.'))return;
      try{await api('/backtest','POST');loadBacktest(box)}catch(e){alert(e.message)}};
    box.append(el('div','mut','Tests four rule-based setups (EMA pullback, squeeze breakout, 20-bar breakout, range reversal) as Scalp, Day and Swing, with costs and no overlapping trades. Results only; nothing here is shown to members.'),run);
    if(st.running)box.append(el('div','mut','Progress: '+st.done+' of '+st.total+' symbols'+(st.current?' ('+st.current+')':'')+'...'));
    if(st.error)box.append(el('div','err',st.error));
    clearTimeout(btTimer);if(st.running)btTimer=setTimeout(()=>loadBacktest(box),5000);
    if(!r.run||!r.rows){box.append(el('div','mut','No results yet.'));return}
    box.append(el('h2','','Pooled within each market (best average R first). Markets are never mixed.'));
    r.pooled.slice(0,16).forEach(x=>box.append(el('div','mut',(x.market==='metal'?'Gold':x.market==='forex'?'Forex':'Synthetic')+' \u00b7 '+STY[x.style]+' \u00b7 '+SET[x.setup]+' \u00b7 target '+x.rr+'R: '+x.n+' trades on '+x.symbols+' symbols ('+x.per_day_all.toFixed(1)+'/day in total), hit rate '+pct(x.hit_rate)+' vs break-even '+pct(x.be_rate)+', average '+sg(x.avg_r)+'R'+(x.t_pooled!==null?' (t='+x.t_pooled.toFixed(1)+')':'')+', positive in both halves on '+x.stable_symbols+' symbols')));
    box.append(el('h2','','Strongest single symbols'));
    r.best.forEach(x=>box.append(el('div','mut',x.name+' \u00b7 '+STY[x.style]+' \u00b7 '+SET[x.setup]+' \u00b7 '+x.rr+'R: '+x.n+' trades, average '+sg(x.avg_r)+'R (halves '+sg(x.avg_r_h1)+' / '+sg(x.avg_r_h2)+'), t='+x.t_stat.toFixed(1))));
    if(r.share_t_over_2!==null)box.append(el('div','mut','Of '+r.tested_combinations+' tested combinations, '+pct(r.share_t_over_2)+' score t above 2. If nothing works, chance alone gives about 2 to 3 percent, so a few strong-looking rows prove nothing.'));
  }catch(e){box.textContent=e.message}
}
async function loadRadarInfo(box){
  try{
    const r=await api('/radar');box.textContent='';
    box.append(el('div','mut','Claude analyses logged: '+r.global.n+' ('+r.global.trade+' with a trade). Last scan: '+(r.scan_age===null?'not yet':r.scan_age+' s ago')+'.'));
    r.rows.forEach(x=>{
      const h=x.history,te=h&&h.time_effect;
      const hist=h?(h.span_days+' days of history; '+(te&&te.significant?'time effect found, best hours (UTC) '+te.best_hours.join(', '):(te&&te.tested?'no meaningful time effect':'still building'))):'history not built yet';
      box.append(el('div','mut',x.name+': '+hist+'; analyses '+x.analyses.n+(x.analyses.rate!==null?' ('+Math.round(x.analyses.rate*100)+'% trade)':'')+(x.now?'; now readiness '+x.now.readiness+', '+x.now.regime:'')));
    });
  }catch(e){box.textContent=e.message}
}
async function load(){try{render(await api('/overview'))}catch(e){$('root').textContent='';$('root').append(el('div','err',e.message),el('p','mut','This page is for admins only.'))}}
load();
</script>
