<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TradeLens Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040a1b">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/favicon-48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/theme.css">
<script src="/auth.js"></script>
</head>
<body>
<header><a class="brand" href="/"><img src="/logo-mark.png" alt=""><span><b>Trade<i>Lens</i></b><small>by Driverline</small></span></a></header>
<main>
<div class="card" id="box"><span class="mut">Checking your payment...</span></div>
<small class="dis">Nothing on this page decides whether a payment succeeded. Only our server, after asking Paystack, can add your signals or plan. <a href="/terms.html" style="color:var(--gold2)">Terms, Refunds and Support</a></small>
</main>
<script>
/* Return page for Paystack (the callback address) and the "Check payment status" link in Billing.
   Paystack sends the member back with ?reference=<our order reference>&trxref=<same>. The page asks OUR server for the status; the
   server checks the transaction with Paystack. Nothing here can credit anything. */
const $=id=>document.getElementById(id);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
const q=new URLSearchParams(location.search);
const REF=q.get('reference')||q.get('trxref')||'';
let timer=null,tries=0,cancelling=false;
const MAX_TRIES=40;                       // about 3 minutes of automatic checking at 4.5 s, then the member can press Check again
async function api(path,method){
  const r=await fetch(path,{method:method||'GET',headers:{'content-type':'application/json'}});
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(typeof d.detail==='string'?d.detail:('HTTP '+r.status));return d}
function line(k,v){const d=el('div','kv');d.append(el('span','',k),el('span','',v));return d}
function naira(n){return '₦'+Math.round(n).toLocaleString()}
function back(){const a=el('a','','Back to Billing');a.href='/billing.html';a.style.cssText='display:inline-block;margin-top:10px;color:var(--gold2)';return a}

function render(o,note){
  const c=$('box');c.textContent='';
  c.append(el('h2','','Payment for '+o.label));
  if(o.test)c.append(el('div','warn','TEST MODE: this is a Paystack test payment. No real money moves.'));
  const out=o.outcome;
  let cls='mut',title='',text='';
  if(out==='success'){cls='win';title='Payment confirmed';
    text=(o.signals?o.signals.toLocaleString()+' signals added':'Purchase complete')+(o.days?' and your plan is active for '+o.days+' days':'')+'.'}
  else if(out==='pending'){title='Waiting for confirmation';
    text=(o.provider_status==='ongoing'||o.provider_status==='pending'||o.provider_status==='processing'||o.provider_status==='queued')
      ?'Paystack is still processing your payment. Bank transfers and USSD can take a few minutes. You do not need to pay again: this page updates by itself, and your signals are added as soon as Paystack confirms.'
      :'We have not received a completed payment for this order yet. If you finished paying, this page updates within a minute. If you left the Paystack page, you can go back and finish.'}
  else if(out==='failed'){cls='loss';title='Payment failed';
    text='Paystack could not complete this payment. Nothing was charged to this order. You can try again from the payment page'+(o.checkout_url?' below':'')+', or start a new order from Billing.'}
  else if(out==='cancelled'){title='Order cancelled';text='This order was cancelled and nothing was added. If you were charged, contact support with the reference below.'}
  else if(out==='expired'){cls='loss';title='Order expired';text='This order closed without a completed payment. If you were charged, contact support with the reference below. Otherwise start a new order from Billing.'}
  else if(out==='review'){cls='warn';title='Being checked by our team';text=o.message||'Your payment is being checked by hand.'}
  else if(out==='refunded'){cls='loss';title='Refunded';text='This payment was refunded.'}
  else if(out==='rejected'){cls='loss';title='Not confirmed';text=o.note||'This payment could not be confirmed.'}
  else{title=o.status;text=''}
  const st=el('div',cls,title);st.style.fontWeight='600';c.append(st);
  if(text)c.append(el('div',cls==='win'?'win':'mut',text));
  c.append(line('Order reference',o.ref),line('Amount',naira(o.amount_naira!=null?o.amount_naira:o.amount_local)));
  if(out==='success'&&o.balance!=null)c.append(line('Your signals now',String(o.balance)));
  if(note){c.append(el('div','mut',note))}
  const row=el('div','btns');
  if(out==='pending'||out==='failed'){
    if(o.checkout_url&&o.checkout_url.startsWith('https://')){const go=el('a','','Continue to Paystack');go.href=o.checkout_url;go.style.cssText='display:inline-block;margin-right:12px;color:var(--gold2)';row.append(go)}
    const rf=el('button','ghost','Check again');rf.onclick=()=>check(true);row.append(rf);
    if(out==='pending'||out==='failed'){const cx=el('button','ghost','Cancel this order');cx.onclick=()=>cancel(o.id);row.append(cx)}
  }
  c.append(row,back());
}
function fail(msg){const c=$('box');c.textContent='';c.append(el('div','err',msg),back())}

async function check(manual){
  clearTimeout(timer);
  if(!REF){fail('No payment reference was given.');return}
  try{
    const r=await api('/api/pay/paystack/status?reference='+encodeURIComponent(REF)+'&refresh=1');
    if(cancelling)return;
    render(r.order,manual?'Checked just now.':'');
    const wait=(r.order.outcome==='pending'||r.order.outcome==='failed')&&r.order.status==='pending';
    if(wait&&++tries<MAX_TRIES)timer=setTimeout(()=>{if(document.hidden){timer=setTimeout(()=>check(false),9000)}else check(false)},4500);
    else if(wait)render(r.order,'Still waiting. You can close this page: if the payment goes through, your signals are added automatically.');
  }catch(e){fail(e.message==='Order not found'?'We could not find that payment. Open Billing to see your orders.':e.message)}
}
async function cancel(id){
  if(!confirm('Cancel this order? If you have already paid, do not cancel: your payment will still be confirmed.'))return;
  cancelling=true;clearTimeout(timer);
  try{const r=await api('/api/pay/paystack/order/'+id+'/cancel','POST');cancelling=false;render(r.order,r.order.outcome==='cancelled'?'':'')}
  catch(e){cancelling=false;fail(e.message)}
}
check(false);
</script>
</body>
</html>
